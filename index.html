<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>변액보험 판매관리사 · 실전모의고사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface2:#ECF2EE;
  --ink:#17241F; --muted:#63756E; --line:#E0E8E2;
  --primary:#0C6B57; --primary-soft:#E0F0E9; --primary-ink:#F2FAF7;
  --wrong:#C43D22; --wrong-soft:#FBEDE7; --star:#DE9500;
  --shadow:0 1px 2px rgba(23,36,31,.05),0 8px 24px rgba(23,36,31,.06);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0D1916; --surface:#152420; --surface2:#1C2E28;
  --ink:#E6EFEA; --muted:#93A69E; --line:#273B34;
  --primary:#45C39F; --primary-soft:rgba(69,195,159,.13); --primary-ink:#06231C;
  --wrong:#E9755A; --wrong-soft:rgba(233,117,90,.15); --star:#F2B93B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#wrap{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
#top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:var(--primary);color:var(--primary-ink);
  display:grid;place-items:center;font-weight:800;font-size:17px}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand p{font-size:11.5px;color:var(--muted);margin-top:1px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);
  border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{color:var(--ink)}
.icn{width:20px;height:20px;display:block}
.icn svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{flex:1;padding:18px 16px 104px}

/* ---- tab bar ---- */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar .in{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;
  font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.tab .icn{width:21px;height:21px}
.tab.on{color:var(--primary)}
.tab.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
.tab .dot{position:absolute;top:7px;margin-left:26px;min-width:16px;height:16px;border-radius:8px;background:var(--wrong);
  color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ---- common ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:18px}
.sec-title{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;border-radius:12px;
  padding:12px 18px;font-size:14.5px;border:1px solid var(--line);background:var(--surface);transition:filter .15s, transform .05s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--wrong);border-color:color-mix(in srgb,var(--wrong) 35%,var(--line))}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip.warn{color:var(--star);border-color:color-mix(in srgb,var(--star) 40%,var(--line));background:color-mix(in srgb,var(--star) 8%,var(--surface))}
.chip.row{display:flex;overflow-x:auto;gap:7px;padding:2px 0 4px;scrollbar-width:none}
.chip.row::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2.5px 8px;border-radius:999px}
.badge.ok{background:var(--primary-soft);color:var(--primary)}
.badge.no{background:var(--wrong-soft);color:var(--wrong)}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---- home ---- */
.hero{padding:22px 20px;background:linear-gradient(135deg,var(--primary) 0%,color-mix(in srgb,var(--primary) 78%,#06342B) 100%);
  color:var(--primary-ink);border:0}
.hero .eyebrow{font-size:12px;font-weight:700;opacity:.75;letter-spacing:.06em}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:5px 0 3px}
.hero .meta{font-size:13px;opacity:.85;font-weight:500}
.hero .go{margin-top:16px;width:100%;padding:14px;border-radius:13px;background:var(--primary-ink);color:var(--primary);
  font-weight:800;font-size:15.5px;border:0;display:flex;align-items:center;justify-content:center;gap:8px}
.hero .go:hover{filter:brightness(1.03)}
.resume{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;margin-bottom:14px;
  background:color-mix(in srgb,var(--star) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--star) 35%,var(--line));
  font-size:13.5px;font-weight:600}
.resume .btn{margin-left:auto;flex:none}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qact{display:flex;flex-direction:column;gap:3px;padding:15px 16px;text-align:left;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.qact b{font-size:14.5px;font-weight:700}
.qact span{font-size:12px;color:var(--muted)}
.qact .icn{margin-bottom:7px;color:var(--primary)}
.notice{display:flex;gap:10px;padding:13px 15px;border-radius:13px;font-size:12.5px;line-height:1.5;
  background:color-mix(in srgb,var(--star) 7%,var(--surface));border:1px dashed color-mix(in srgb,var(--star) 45%,var(--line));color:var(--muted)}
.notice .icn{flex:none;color:var(--star);margin-top:2px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:13px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}

.hero .btnrow{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.go.alt{background:rgba(255,255,255,.12);color:var(--primary-ink);border:1px solid rgba(255,255,255,.35)}
.go.alt:hover{filter:brightness(1.08)}
.setlabel{font-size:12px;font-weight:800;color:var(--muted);margin:12px 2px 7px}
.rlabel{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}

/* ---- exam ---- */
.xbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.xbar .prog{font-weight:800;font-size:14px}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:7px 12px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);margin-left:auto}
.timer.low{color:var(--wrong);border-color:color-mix(in srgb,var(--wrong) 45%,var(--line));background:var(--wrong-soft)}
.starr{margin-left:8px}
.starbtn{color:var(--line-d,#C9D4CE);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.starbtn.on{color:var(--star)}
.starbtn.on svg{fill:var(--star);stroke:var(--star)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qno{font-weight:800;font-size:13px;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:8px}
.qtype{font-size:11.5px;font-weight:700;color:var(--muted)}
.qtext{font-size:16.5px;font-weight:700;line-height:1.5;letter-spacing:-.01em;white-space:pre-wrap}
.tbox{margin:12px 0;padding:12px 14px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);
  font-size:13.5px;font-weight:500;color:var(--ink)}
.tbox div{padding:2px 0;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;padding:13px 15px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;line-height:1.45;transition:border-color .12s, background .12s}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;border:1.5px solid var(--line);color:var(--muted);margin-top:.5px}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .mark{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt.good{border-color:var(--primary);background:var(--primary-soft)}
.opt.good .mark{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt.bad{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.bad .mark{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt.lock{cursor:default}
.opt .tail{margin-left:auto;flex:none;display:grid;place-items:center;color:var(--primary)}
.opt.bad .tail{color:var(--wrong)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ox .opt{justify-content:center;font-size:19px;font-weight:800;padding:18px}
.expl{margin-top:14px;padding:14px 16px;border-radius:12px;border-left:4px solid var(--primary);
  background:var(--primary-soft);font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.expl b{color:var(--primary)}
.expl.none{border-left-color:var(--line);background:var(--surface2);color:var(--muted)}
.xnav{position:fixed;bottom:62px;left:0;right:0;z-index:25;padding:10px 14px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.xnav .in{max-width:760px;margin:0 auto;display:flex;gap:9px}
.xnav .btn{flex:1}
.xnav .btn.omr{flex:0 0 108px}

/* ---- OMR grid (signature) ---- */
.omrgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.omrgrid.g40{grid-template-columns:repeat(8,1fr)}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-size:12.5px;font-weight:700;
  border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.cell.filled{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 45%,var(--line));color:var(--primary)}
.cell.cur{outline:2.5px solid var(--primary);outline-offset:1.5px;color:var(--primary)}
.cell.ok{background:color-mix(in srgb,var(--primary) 88%,#000 0%);border-color:var(--primary);color:var(--primary-ink)}
.cell.no{background:var(--wrong);border-color:var(--wrong);color:#fff}
.cell.blank{background:repeating-linear-gradient(45deg,var(--wrong-soft),var(--wrong-soft) 4px,var(--surface) 4px,var(--surface) 8px);border-color:var(--wrong);color:var(--wrong)}
.cell.heat1{background:color-mix(in srgb,var(--wrong) 55%,var(--surface));border-color:transparent;color:#fff}
.cell.heat2{background:color-mix(in srgb,var(--star) 45%,var(--surface));border-color:transparent}
.cell.heat3{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.cell.heat4{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

/* ---- sheet / modal / toast ---- */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet.hidden,#modal.hidden,#toast.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,20,17,.45)}
.sheet-card{position:relative;width:100%;max-width:760px;max-height:78dvh;overflow:auto;background:var(--surface);
  border-radius:20px 20px 0 0;padding:18px 18px 26px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-grip{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px}
.modal-bg{position:absolute;inset:0;background:rgba(10,20,17,.45)}
.modal-card{position:relative;width:100%;max-width:430px;background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow);max-height:86dvh;overflow:auto}
.modal-card h3{font-size:16.5px;font-weight:800;margin-bottom:8px}
.modal-card p{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.modal-acts{display:flex;gap:9px;margin-top:16px}
.modal-acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}

/* ---- result ---- */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:24px 18px 18px}
.gauge{position:relative;width:170px;height:170px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .track{fill:none;stroke:var(--surface2);stroke-width:11}
.gauge .val{fill:none;stroke:var(--primary);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)}
.gauge.fail .val{stroke:var(--wrong)}
.gauge .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .mid b{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gauge .mid span{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.passline{margin-top:10px}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rsum .stat{text-align:center;padding:11px 6px}

/* ---- bank / list ---- */
.search{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:10px}
.search input{border:0;background:none;outline:none;flex:1;font-size:14px}
.search .icn{color:var(--muted)}
.qcard{margin-bottom:12px;overflow:hidden}
.qcard .pad{padding:16px}
.optrow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;font-size:13.5px;font-weight:600}
.optrow .mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;
  border:1.5px solid var(--line);color:var(--muted)}
.optrow.good{background:var(--primary-soft);color:var(--primary)}
.optrow.good .mark{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.qtools{display:flex;gap:6px;margin-left:auto}
.mini{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.mini:hover{color:var(--ink)}
.mini.on{color:var(--star)}
.mini.on svg{fill:var(--star);stroke:var(--star)}
.mini .icn{width:15.5px;height:15.5px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .icn{width:40px;height:40px;margin:0 auto 10px;opacity:.5}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
.empty p{font-size:13px}

/* ---- wrong / stats ---- */
.wrongrow{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:13px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:9px}
.wrongrow .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--wrong-soft);color:var(--wrong);
  display:grid;place-items:center;font-weight:800;font-size:13px}
.wrongrow .t{min-width:0;flex:1}
.wrongrow .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrongrow .t span{font-size:11.5px;color:var(--muted);font-weight:600}
.wrongrow .cnt{flex:none;font-size:11px;font-weight:800;color:var(--wrong);background:var(--wrong-soft);border-radius:999px;padding:3px 9px}
.wrongrow .cnt.hot{background:var(--star);color:#fff}
.trend{display:flex;align-items:flex-end;gap:7px;height:120px;padding:14px 16px 10px}
.trend .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.trend .bar i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--primary-soft);
  border:1px solid color-mix(in srgb,var(--primary) 30%,var(--line));transition:height .6s}
.trend .bar i.pri{background:var(--primary);border-color:var(--primary)}
.trend .bar span{font-size:9.5px;font-weight:700;color:var(--muted)}
.hist{padding:4px 0}
.hist .row{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13px}
.hist .row:last-child{border-bottom:0}
.hist .row b{font-weight:800}
.hist .row .sc{margin-left:auto;font-weight:800;font-size:15px}
.hist .row .sc.fail{color:var(--wrong)}
.hist .row .sc.pass{color:var(--primary)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:13.5px;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.anspick{display:flex;gap:7px;flex-wrap:wrap}
.anspick .chip{cursor:pointer}
@media (min-width:640px){
  .omrgrid.g40{grid-template-columns:repeat(10,1fr)}
  .qgrid{grid-template-columns:repeat(4,1fr)}
  .statrow{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="wrap">
  <header id="top">
    <div class="brand"><span class="logo">변</span><div><h1>변액보험 판매관리사</h1><p>실전모의고사 1~10회 · 400문항</p></div></div>
    <button class="iconbtn" id="darkBtn" data-act="dark" aria-label="다크 모드 전환"></button>
  </header>
  <main id="screen"></main>
  <nav id="tabbar"><div class="in">
    <button class="tab on" data-act="tab" data-tab="home"><span class="icn"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4.5l8 7V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></span>홈</button>

window.QUESTIONS=[{"id":1,"type":"ox","q":"생명보험회사의 변액보험과 금융투자회사의 실적배당상품과의 공통점은 적립금액에 대한 최저보증옵션을 선택할 수 있다는 점이다. ( X )","answer":"X","expl":"(X) 금융투자회사의 실적배당상품에는 최저보증옵션이 없다.","tb":[]},{"id":2,"type":"ox","q":"보험계약에 관하여 분쟁이 있는 경우 분쟁당사자 또는 기타 이해관계인과 보험회사는 금융감독원장에게 조정을 신청할 수 있다. ( O )","answer":"O","expl":"(O) 맞는 설명이다.","tb":[]},{"id":3,"type":"ox","q":"변액보험 특별계정(펀드)의 평가는 매일 시가법에 의해 실시한다. ( O )","answer":"O","expl":"(O) 맞는 설명이다.","tb":[]},{"id":4,"type":"ox","q":"통상 만기가 1년 미만인 금융상품이 거래되는 단기금융시장은 그 규모가 매우 크지만 실제 참가자들은 일반 개인이 아닌 금융기관이나 연기금 등을 위주로 구성되어 있다. ( O )","answer":"O","expl":"(O) 맞는 설명이다.","tb":[]},{"id":5,"type":"mc","q":"다음 중 금리에 대해 맞게 설명한 것은?","opts":["물가변동 고려여부에 따라 표면금리와 실효금리로 구분된다.","명목금리는 실질금리에서 소비자물가지수 상승률을 차감하여 계산한다.","금리의 변동은 자금의 수요와 공급규모에 영향을 미친다.","금리간 수준비교는 통상 표면금리를 기준으로 이루어진다."],"answer":2,"expl":"① 물가변동 고려여부에 따라 명목금리와 실질금리로 구분된다.\n② 실질금리는 명목금리에서 소비자물가지수 상승률을 차감하여 계산한다.\n④ 금리간 수준비교는 통상 실효금리를 기준으로 이루어진다."},{"id":6,"type":"mc","q":"다음 중 저축성 변액보험의 수수료 안내표 제공 시 필수 포함 내용에 해당하지 않는 것은?","opts":["최저보증비용","과거 3년간 자산운용수익률","위험보험료","특별계정 운용보수"],"answer":1,"expl":"② 과거 3년간 자산운용수익률은 수수료 안내표의 내용이 아니다."},{"id":7,"type":"mc","q":"다음 표의 변액연금보험 계약에서 연금개시시점의 연금지급 재원으로 맞는 것은?","tb":["• 35세 가입, 20년 납입, 60세 연금개시 |","(단, 연금지급시점에서 이미 납입한 보험료 최저보증) |","• 주계약 납입보험료 : 매월 20만원 |","• 60세 시점의 계약자적립금 : 4,000만원 |"],"opts":["2,400만원","4,000만원","4,800만원","6,000만원"],"answer":2,"expl":"③ 4,800만원 (= 이미 납입한 보험료 4,800만원과 계약자적립금 4,000만원 중 큰 금액)"},{"id":8,"type":"mc","q":"다음 중 변액보험과 투자신탁(수익증권)에 대해 틀리게 설명한 것은?","opts":["변액보험의 가입목적은 인플레이션 헤지를 통한 보험금의 실질가치 보전에 있다.","투자신탁(수익증권)은 간접투자를 통해 고수익을 추구하는 상품이다.","투자신탁(수익증권)은 10년 이상 유지할 경우 이자소득 비과세 혜택이 있다.","변액보험과 투자신탁(수익증권) 모두 실적배당형 상품이다."],"answer":2,"expl":"③ 10년 이상 유지할 경우 이자소득 비과세 혜택이 적용되는 것은 변액보험이다."},{"id":9,"type":"mc","q":"다음 표에서 설명하는 용어로 맞는 것은?","tb":["생명보험협회, 손해보험협회가 공동으로 운영하는 중도, 만기, 휴면 보험금을 찾아주는 서비스 사이트 |"],"opts":["보험다모아","내보험찾아줌","금융상품 한눈에","통합연금포털"],"answer":1,"expl":"② 내보험찾아줌에 대한 설명이다."},{"id":10,"type":"mc","q":"다음 표의 (    ) 안에 들어갈 용어를 순서대로 맞게 나열한 것은?","tb":["변동보험금은 ( (가) )과 해당 보험계약의 산출이율로 계산된 기본보험계약의 ( (나) )과의 차액, 즉 ( (다) )을 가지고 계산된다. |"],"opts":["(가) 실제 계약자적립금 (나) 예정적립금 (다) 초과적립금","(가) 초과적립금 (나) 기본보험금 (다) 실제 계약자적립금","(가) 예정적립금 (나) 실제 계약자적립금 (다) 초과적립금","(가) 실제 계약자적립금 (나) 기본보험금 (다) 초과보험금"],"answer":0,"expl":"① (가) 실제 계약자적립금 (나) 예정적립금 (다) 초과적립금"},{"id":11,"type":"mc","q":"다음 표에서 설명하는 변액보험 특별계정(펀드)의 자산운용옵션은 무엇인가? 투자성과에 따라 변동된 펀드의 적립액 비율을 고객이 설정한 비율로 일정주기마다 조정하는 자산운용옵션","tb":[],"opts":["펀드변경 기능","펀드별편입비율설정 기능","펀드자동재배분 기능","보험료평균분할투자 기능"],"answer":2,"expl":"③ 펀드 자동재배분 기능"},{"id":12,"type":"mc","q":"다음 중 변액유니버셜보험의 특징에 대해 틀리게 설명한 것은?","opts":["계약자는 해약환급금의 범위 내에서 적립금의 중도인출이 가능하다.","특별계정(펀드)의 운용실적에 따라 해약환급금이 변동한다.","보험료 납입을 중지할 경우 위험보험료, 사업비 등을 계약자적립금에서 공제한다.","수시 입출금이 가능함에 따라 특약부가 가 제한적이다."],"answer":3,"expl":"④ 특약부가 가 모든 보험에서 공통으로 적용되므로 제한되는 것이 아니다."},{"id":13,"type":"mc","q":"다음 표의 (  ) 안에 들어갈 내용으로 맞는 것은? 주식을 매입한 사람은 발행회사가 지정한 기관에서 (    )을/를 해야 주주로서의 권리를 갖게 된다.","tb":[],"opts":["계좌등록","증권인수","명의개서","주식예탁"],"answer":2,"expl":"③ 명의개서"},{"id":14,"type":"mc","q":"다음 중 변액보험의 해약환급금 예시를 위해 가정할 수 있는 투자수익률이 아닌 것은?","opts":["-1%","평균공시이율","평균공시이율 x 1.5","평균공시이율 x 2"],"answer":3,"expl":"④ (평균공시이율 x 2)는 예시수익률이 아니다."},{"id":15,"type":"mc","q":"다음 중 변액보험의 보험계약대출에 대해 틀리게 설명한 것은?","opts":["보험계약대출 이자는 보험계약대출 수수료를 차감한 후 특별계정(펀드)투입된다.","특별계정방식으로 보험계약대출을 신청할 경우 일반계정에서 특별계정(펀드)으로 대출금액을 이체한 후 지급한다.","보험계약대출 원리금은 보험기간 동안 언제든지 상환할 수 있다.","대출상환금액은 「상환일 + 제2영업일」에 특별계정(펀드)으로 투입된다."],"answer":1,"expl":"② 특별계정(펀드)에서 일반계정으로 대출금액을 이체한 후 지급한다."},{"id":16,"type":"mc","q":"다음 표의 경우 A은행 파산시 「예금자보호법」에 의해 예금자에게 지급되는 보험금으로 맞는 것은? 예금자는 A은행에 다음과 같은 금융상품에 가입되어 있음","tb":["- 보통예금 : 3,000만원(원금+이자)","- 확정급여형퇴직연금 적립금 : 3,000만원(원금+이자)"],"opts":["3,000만원","5,000만원","6,000만원","7,000만원"],"answer":0,"expl":"① 3,000만원 (확정급여형 퇴직연금은 보호 금융상품이다.)"},{"id":17,"type":"mc","q":"다음 변액보험 특별계정(펀드) 운용현황표에 대해 맞게 설명한 것은?","tb":["기준가격 | 전일대비 | 연환산수익률 | 순자산가치 |","1,520.00 | +2.00 | 6.00% | 500억원 |"],"opts":["전일의 기준가격은 1,522.00이다.","펀드 최초개설일보다 기준가격이 상승하였다.","상기자료만으로 누적수익률은 확인할 수 없다.","최근 1년간의 수익률은 6.00%이다."],"answer":1,"expl":"① 전일의 기준가격은 1,518.00이다.\n③ 누적수익률은 52%로 확인할 수 있다.\n④ 운용현황표로는 최근 1년간의 수익률을 확인할 수 없다."},{"id":18,"type":"mc","q":"다음 표에서 금융소득에 대해 틀리게 설명한 것은? 금융소득은 (가) 이자소득, 배당소득, 양도소득을 총칭하는 개념으로, (나) 비과세 및 분리과세 금융소득을 제외한 연간금융소득 중 (다) 2천만원을 초과하는 금액에 대해서는 금융소득 전체를 종합과세하며 (라) 개인별로 과세하는 것을 원칙으로 한다.","tb":[],"opts":["(가)","(나)","(다)","(라)"],"answer":0,"expl":"(가) 양도소득은 금융소득이 아니다."},{"id":19,"type":"mc","q":"다음 중 변액보험에서 사업비 외 추가로 부과되는 비용이 아닌 것은?","opts":["특별계정 운영보수","특별계정 수탁보수","최저사망보험금(GMDB) 보증비용","보험계약대출 보증비용"],"answer":3,"expl":"보험계약대출 보증비용은 아니다."},{"id":20,"type":"mc","q":"다음 중 우리나라의 변액보험과 관련한 법적 규제에 대해 맞게 설명한 것은?","opts":["손해보험회사는 변액보험을 판매할 수 없다.","변액보험의 정의는 「보험업법」에 명시되어 있다.","보험회사의 임직원은 변액보험을 모집할 수 없다.","변액보험의 펀드는 「보험업법」의 규제를 받아 「자본시장법」상 집합투자기구 외의 운용수수료 예외가 인정된다."],"answer":0,"expl":"변액보험은 생명보험회사만 판매할 수 있다. 따라서 '손해보험회사는 변액보험을 판매할 수 없다'가 맞다."},{"id":21,"type":"mc","q":"다음 표의 (  ) 안에 공통으로 들어갈 기간으로 맞는 것은? 금융시장은 거래되는 금융상품의 만기를 기준으로 보통 만기 ( ) 미만의 단기금융시장과 만기 ( ) 이상의 장기금융시장으로 구분된다.","tb":[],"opts":["1년","3년","1개월","3개월"],"answer":0,"expl":"1년"},{"id":22,"type":"mc","q":"다음 중 변액보험 보험료의 특별계정(펀드) 투입일에 대하여 맞게 설명한 것은?","opts":["제1회 보험료: 청약철회기간 이후에 승낙한 경우 '승낙일'","제2회 이후 보험료: 계약해당일 이후에 납입한 경우 '납입일 + 제2영업일'","추가납입보험료: '납입일 + 제1영업일'","선납보험료: '매월 계약해당일'"],"answer":1,"expl":"판독된 투입일 규칙: 제1회 보험료는 청약철회기간 이후 승낙한 경우 승낙일, 제2회 이후 보험료는 계약해당일 이후 납입 시 '납입일 + 제2영업일', 추가납입보험료는 '납입일 + 제2영업일'이다."},{"id":23,"type":"mc","q":"다음 중 변액보험의 최저보증옵션에 대해 맞게 설명한 것은?","opts":["변액유니버셜보험(보장형)의 최저사망보험금 보증은 보험계약자가 설정 여부를 선택할 수 있다.","일정 수준 이상의 사망보험금과 연금재원을 보증하기 위한 수단이다.","변액유니버셜보험은 이미 납입한 보험료를 해약환급금으로 최저보증한다.","변액연금보험은 해약환급금을 최저보증하기 위하여 별도의 보증비용을 공제한다."],"answer":2,"expl":"변액유니버셜보험(보장형)의 최저사망보험금 보증은 설정 여부를 선택할 수 없고(① 틀림), 이미 납입한 보험료를 최저보증한다(③ 맞음)."},{"id":24,"type":"mc","q":"다음 중 단기사채의 발행요건에 대해 맞게 설명한 것은?","opts":["발행금액 최소 1억원 이상, 만기 6개월 이내","발행금액 최소 3억원 이상, 만기 6개월 이내","발행금액 최소 1억원 이상, 만기 1년 이내","발행금액 최소 3억원 이상, 만기 1년 이내"],"answer":2,"expl":"발행금액 최소 1억원 이상, 만기 1년 이내","tb":[]},{"id":25,"type":"mc","q":"다음 중 생명보험의 세제혜택 대상에 대한 설명으로 틀린 것은?","opts":["보장성 보험료의 세액공제는 근로소득이 있는 경우에만 가능하다.","연금계좌는 근로소득이 없더라도 세액공제나 가능하다.","비과세종합저축의 경우 65세 이상자 또는 장애인 등을 대상으로 한다.","저축성보험의 보험차익 비과세는 종합소득이 있는 경우에만 가능하다."],"answer":3,"expl":"저축성보험의 보험차익 비과세는 모든 거주자에게 적용된다.\n* 종합소득세를 납부하지 않는 사람도 저축성보험의 보험차익 비과세 혜택을 볼 수 있다.","tb":[]},{"id":26,"type":"mc","q":"다음 중 보험정보 공시가 확대되는 배경에 대해 틀리게 설명한 것은?","opts":["보험상품가격의 자유화","방카슈랑스 등 보험영업채널 다변화","공급자 중심의 금융정책 이동","소비자보호 강화"],"answer":2,"expl":"공급자 중심에서 소비자 중심으로 금융정책 이동"},{"id":27,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 채권형펀드 자산으로 편입될 수 없는 것은?","opts":["전환사채","양도성예금증서","예금","상장주식"],"answer":3,"expl":"상장주식은 투자할 수 없다."},{"id":28,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 계약자 보유좌수가 변동하는 경우가 아닌 것은?","opts":["보험계약자가 보험료를 추가로 납입하였다.","보험계약자가 보험계약대출 원리금을 상환하였다.","자산운용 실적이 호전되었다.","월대체보험료가 차감되었다."],"answer":2,"expl":"자산운용 실적이 호전되어도 펀드의 좌수가 변동하는 것은 아니다.\n* 좌수의 변동\n| 증가하는 경우 (돈이 투입될 때) | 보험료 (추가)납입, 대출원리금 상환 등 |\n| 감소하는 경우 (돈이 빠져나올 때) | 중도인출, 월대체보험료 차감, 약관대출 실행, 보험가입금액 감액 등 |"},{"id":29,"type":"mc","q":"다음 중 표에서 설명하고 있는 보험의 기본적인 원리는 무엇인가? 동전을 10번 던질 경우 앞면은 10번 나오거나 한 번도 나오지 않을 수 있지만, 동전은 10,000번 던진다면 약 절반 정도는 앞면이 나올 것이다.","tb":[],"opts":["수지상등의 원칙","대수의 법칙","소득재분배의 원칙","포괄성의 원칙"],"answer":1,"expl":"대수의 법칙에 대한 설명이다."},{"id":30,"type":"mc","q":"다음 중 변액연금보험의 해약환급금에 대해 맞게 설명한 것은?","opts":["계약 해지 시, 기준가격은 해약신청일 당일의 기준가격을 적용한다.","보험료 납입횟수, 투자수익률과는 무관하다.","계약 초기에는 이미 납입한 보험료보다 적은 금액이 될 수 있다.","보험가입금액에서 해약공제금액을 차감하여 해약환급금으로 지급한다."],"answer":2,"expl":"해약 시 기준가격은 해지신청일 + 제2영업일 기준(① 틀림)이고, 해약환급금은 계약자적립금에서 해약공제금액을 차감해 지급한다(④ 틀림). 계약 초기에는 사업비 공제로 납입보험료보다 적을 수 있다(③ 맞음)."},{"id":31,"type":"mc","q":"다음 중 변액보험의 보험료에 대해 맞게 설명한 것은?","opts":["변액종신보험은 월납과 연납의 납입방법만 선택할 수 있다.","변액유니버셜보험에서는 납입보험료 중 기타비용을 제외한 금액이 특별계정에 투입된다.","변액유니버셜보험의 의무납입기간에는 보험료를 추가납입할 수 없다.","변액연금보험은 이미 납입한 보험료의 3배 이내에서 보험료 추가납입이 가능하다."],"answer":1,"expl":"변액유니버셜보험은 납입보험료 중 기타비용을 제외한 금액이 특별계정에 투입된다(② 맞음). 의무납입기간에도 추가납입이 가능하고(③ 틀림), 변액연금보험의 추가납입 한도는 기본보험료의 2배 이내이다(④ 틀림)."},{"id":32,"type":"mc","q":"다음 표에서 설명하는 단체는 무엇인가? 핵실험 반대와 자연보호 운동 등을 통하여 지구의 환경을 보존하고 평화를 증진하기 위해 1971년 설립된 국제 환경보호 단체","tb":[],"opts":["그린피스","적십자","WTO","FTA"],"answer":0,"expl":"그린피스에 대한 설명이다."},{"id":33,"type":"mc","q":"다음 중 비과세 및 분리과세 금융투자상품에 대해 틀리게 설명한 것은?","opts":["비과세 적용 : 일정 요건을 충족한 저축성보험의 보험차익","분리과세 적용 : 2012년 12월 31일까지 발행된 10년 이상의 장기채권의 이자를 분리과세 신청한 경우","비과세 적용 : 2014년 12월 31일까지 가입한 세금우대종합저축에서 발생하는 이자, 배당","비과세 적용 : 65세 이상인 거주자가 1명당 저축원금 5,000만원 이하인 비과세 종합저축에 기한 내에 가입한 경우 그 저축의 이자, 배당"],"answer":2,"expl":"세금우대종합저축에서 발생하는 이자, 배당은 비과세가 적용되는 것이 아니라 세금우대상품이다. 14%세율에서 5%를 감면하여 9% 세율로 과세한다.","tb":[]},{"id":34,"type":"mc","q":"다음 중 보험회사의 변액보험 특별계정(펀드) 폐지 사유가 아닌 것은?","opts":["당해 각 특별계정 펀드의 자산이 급격히 감소하거나, 자산가치의 변화로 인해 효율적인 자산운용이 곤란해진 경우","설정한 후 1년이 되는 날에 투자신탁의 설정액이 50억원 미만인 경우","설정한 후 6개월이 지난 후 1개월간 계속하여 투자신탁의 설정액이 50억원 미만인 경우","당해 각 특별계정 펀드의 운용대상이 소멸할 경우"],"answer":2,"expl":"6개월 → 1년"},{"id":35,"type":"mc","q":"다음 표의 ( )에 들어갈 용어를 순서대로 맞게 나열한 것은? 자본금 100억원인 회사가 기존 주식 10주를 1주로 줄이는 감자를 실시하면 주식의 액면금액에는 변동이 없이 자본금이 ( 가 )으로 줄어들고, 나머지 ( 나 )은 누적손실과 상계하는 결과가 된다.","tb":[],"opts":["(가) 11억원 (나) 89억원","(가) 1억원 (나) 99억원","(가) 10억원 (나) 90억원","(가) 50억원 (나) 50억원"],"answer":2,"expl":"(가) 10억원 (나) 90억원"},{"id":36,"type":"mc","q":"다음 중 신주인수권부사채에 대해 틀리게 설명한 것은?","opts":["사채보유자가 신주인수권을 행사할 때는 약정된 매입자금을 납입하고 신주를 인수하게 된다.","사채와 신주인수권이 하나로 결합된 증권이다.","신주인수권만 따로 거래하는 것은 불가능하다.","주식을 취득하더라도 채권의 효력은 만기까지 존속된다."],"answer":2,"expl":"신주인수권만 따로 거래하는 것이 가능하다.(분리형)"},{"id":37,"type":"mc","q":"다음 중 보험금 관련 세제에 대해 틀리게 설명한 것은?","opts":["피보험자의 사망으로 지급받는 보험금은 상속세 과세대상이다.","상속받은 보험금은 금융재산 상속공제 대상이다.","미성년자인 보험계약자가 수령하는 보험금은 증여세 과세대상이다.","납입기간이 4년이고, 계약기간이 8년인 월적립식 저축성보험의 보험금은 비과세대상이다."],"answer":3,"expl":"납입기간이 5년 이상, 계약기간이 10년 이상","tb":[]},{"id":38,"type":"mc","q":"다음 중 변액보험을 특별계정으로 운용하는 이유에 대해 틀리게 설명한 것은?","opts":["변액보험은 투자상의 실적과 위험을 계약자가 부담하기 때문","변액보험은 자산운용의 규모가 방대하기 때문","변액보험의 자산은 개인별 적립금의 산출이 공정해야 하기 때문","변액보험은 실적배당형 상품이어서 일반보험과는 자산운용의 목적이 상이하기 때문"],"answer":1,"expl":"자산운용의 규모와 특별계정의 필요성과는 관련이 없다."},{"id":39,"type":"mc","q":"다음 중 약관의 설명의무에 대해 틀리게 설명한 것은?","opts":["보험회사는 보험계약자에게 약관의 중요한 내용을 설명해야 한다.","청약철회에 관한 사항은 설명해야 할 중요한 내용에 해당한다.","보험계약자에게 설명해야 할 약관의 중요한 내용은 보험종류에 따라 다르다.","약관의 설명의무를 위반한 경우 보험계약자는 청약일부터 6개월 이내에 그 계약을 취소할 수 있다."],"answer":3,"expl":"보험계약 성립일부터 3개월 이내에 그 계약을 취소할 수 있다."},{"id":40,"type":"mc","q":"다음 중 변액종신보험과 일반종신보험의 공통점을 모두 고른 것은?","tb":["(가) 자유로운 특약선택","(나) 일반계정으로 운용","(다) 투자수익률로 부리","(라) 세제혜택"],"opts":["(가), (나)","(나), (다)","(다), (라)","(가), (라)"],"answer":3,"expl":"(가), (라)\n* (나) 변액종신보험은 특별계정에서 운용, (다) 변액종신보험은 펀드의 투자수익률로, 일반종신보험은 일반계정의 공시이율로 부리된다."}];

window.QUESTIONS2=[{"id":1001,"s":2,"type":"ox","q":"변액종신보험의 특별계정 투입보험료는 순보험료와 납입 중 계약유지비용을 합한 금액이다. ( )","answer":"X","expl":"(X) 특별계정 투입보험료는 순보험료와 납입 후 계약유지비용이다.","tb":[]},{"id":1002,"s":2,"type":"ox","q":"금융감독원은 물가동향, 국내외 경제상황, 금융시장 여건 등을 종합적으로 고려하여 연 8회 기준금리를 결정한다. ( )","answer":"X","expl":"(X) 금융감독원 → 금융통화위원회","tb":[]},{"id":1003,"s":2,"type":"ox","q":"일용근로자가 기본공제대상자를 피보험자로 하는 일반 보장성보험에 가입한 경우 세액공제를 받을 수 있다. ( )","answer":"X","expl":"(X) 보장성보험료 세액공제는 근로소득자에게만 적용되며, 일용근로자는 제외된다.","tb":[]},{"id":1004,"s":2,"type":"ox","q":"변액보험 특별계정(펀드)의 자산평가와 결산은 매년 1회 실시한다. ( )","answer":"X","expl":"(X) 매년 → 매일","tb":[]},{"id":1005,"s":2,"type":"mc","q":"다음 중 ( )안에 들어갈 내용으로 맞는 것은?","tb":["변액종신보험에서 '최저사망보험금 보증기간'은 납입최고(독촉)기간이 끝나는 날의 다음날부터 ( )이 될 때까지의 기간을 말하며, '최저사망보험금 보증기간'이 끝나는 경우 계약은 효력이 없어진다. |"],"opts":["펀드기준가가 0원","예정해약환급금이 0원","납입기간 종료일","최종 보험료 납입일의 익월 마지막날"],"answer":1,"expl":"② 예정해약환급금이 0원"},{"id":1006,"s":2,"type":"mc","q":"다음 표에서 설명하는 책임준비금 항목은?","tb":["보험계약 내 각 계약들의 경계 내에 있는 발생사고요소의 모든 미래 현금흐름의 현재가치 추정치 |"],"opts":["최선추정부채","위험조정","보험계약마진","이행현금흐름"],"answer":0,"expl":"① 최선추정부채에 대한 설명이다."},{"id":1007,"s":2,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)에 대해 틀리게 설명한 것은?","opts":["주식형 펀드는 주식시장 하락시 원금손실이 발생할 수 있다.","채권형 펀드는 10% 한도 내에서 주식에 투자할 수 있다.","혼합형 펀드는 주식과 채권에 모두 투자할 수 있다.","단기채권형 펀드는 원금손실 가능성이 거의 없다."],"answer":1,"expl":"② 채권형 펀드는 주식에 투자할 수 없다."},{"id":1008,"s":2,"type":"mc","q":"다음 표의 내용 중 법인세, 소득세, 상속세 및 증여세의 세율 구간으로 올바른 것은?","tb":["(가) 법인세 : 10% ~ 30% | (나) 소득세 : 최저 6% ~ 40% | (다) 상속세 및 증여세 : 10% ~ 50% |"],"opts":["(가)","(가), (다)","(나), (다)","(다)"],"answer":3,"expl":"④ (다) * (가) 법인세 : 9% ~ 24%, (다) 소득세 : 6% ~ 45%"},{"id":1009,"s":2,"type":"mc","q":"다음 중 변액종신보험에 대해 맞게 설명한 것은?","opts":["일반종신보험과 통합하여 특별계정에서 자산운용한다.","보험기간이 종신이므로 연금전환특약은 활용할 수 없다.","변동보험금은 매월 계약해당일에 재계산하여 1개월간 확정·적용된다.","일반보험과 달리 우량체 할인제도가 없다."],"answer":2,"expl":"① 일반종신보험은 일반계정에서, 변액종신보험은 특별계정에서 자산운용한다.\n② 연금전환특약을 활용할 수 있다.\n④ 우량체 할인제도를 활용할 수 있다."},{"id":1010,"s":2,"type":"mc","q":"다음 중 변액연금보험에 대해 틀리게 설명한 것은?","opts":["보험계약자의 투자성향에 따라 혼합형펀드 등의 자산운용 형태를 선택할 수 있다.","연금개시 이후 적립금을 일반계정에서 운용할 수 있다.","사망보험금은 투자실적에 따라 매일 변동한다.","투자수익률과 순수익률 중 하나를 선택하여 예시해야 한다."],"answer":3,"expl":"④ 투자수익률과 순수익률을 함께 예시해야 하며, 선택하는 것이 아니다."},{"id":1011,"s":2,"type":"mc","q":"다음 중 생명보험계약에 대해 맞게 설명한 것은?","opts":["보험계약자는 보험회사의 승낙 없이도 보험종목을 변경할 수 있다.","보험계약자는 보험계약이 성립되면 보험계약을 취소할 수 없다.","보험회사는 보험계약자의 약관교부 요구가 없는 경우에는 약관을 교부할 의무가 없다.","보험계약은 일반적으로 보험계약자가 제1회 보험료를 납입하면 보험회사의 책임이 개시된다."],"answer":1,"expl":"① 보험종목을 변경시 보험회사의 승낙이 있어야 한다.\n② 보험계약자는 보험계약이 성립된 이후 언제든지 임의로 보험계약을 취소할 수 있다.\n③ 약관교부 요구가 없는 경우에도 약관을 교부할 의무가 있다."},{"id":1012,"s":2,"type":"mc","q":"다음 중 변액보험의 현금흐름 및 수수료 차감 방식 등에 대해 틀리게 설명한 것은?","opts":["최저보증비용은 매일 또는 매월 차감한다.","특별계정 운용보수는 매일 차감한다.","변액유니버셜보험의 의무납입기간 중에는 보험료를 정기적으로 납입해야 한다.","변액유니버셜보험의 의무납입기간 중에는 선택특약 보험료를 월 공제액으로 차감한다."],"answer":3,"expl":"④ 의무납입기간 이후부터 월 공제액(월대체보험료)으로 차감하는 것이다."},{"id":1013,"s":2,"type":"mc","q":"다음 중 변액유니버셜보험에 대해 틀리게 설명한 것은?","opts":["보험계약자는 해약환급금 일정범위 내에서 적립금의 중도인출이 가능하다.","적립형은 기본보험금을 사망보험금으로 최저보증한다.","의무납입기간 이후 매월 계약해당일에 월대체보험료가 차감된다.","수시입출금이 가능하고 다양한 선택특약을 자유조립할 수 있다."],"answer":1,"expl":"② 적립형은 이미 납입한 보험료를 사망보험금으로 최저보증한다."},{"id":1014,"s":2,"type":"mc","q":"다음 중 보험회사의 정기공시에 대해 틀리게 설명한 것은?","opts":["결산공시는 사업연도말 결산일부터 3개월 이내에 하여야 한다.","결산공시는 인터넷 홈페이지 경영공실실에 3년간 공시하여야 한다.","분기공시는 분기 결산일부터 1개월 이내에 하여야 한다.","분기공시는 다음 분기 임시결산 공시 전까지 공시하여야 한다."],"answer":2,"expl":"③ 분기공시는 분기 결산일로부터 2개월 이내에 하여야 한다.","tb":[]},{"id":1015,"s":2,"type":"mc","q":"다음 중 저축성 변액보험의 수수료 안내표 제공 시 포함 내용에 해당하지 않는 것은?","opts":["보증비용","최근 1년간의 공시이율","위험보험료","특별계정(펀드) 운용비용"],"answer":1,"expl":"② 최근 1년간의 공시이율은 수수료안내표의 내용이 아니다."},{"id":1016,"s":2,"type":"mc","q":"다음 중 변액보험의 펀드변경에 대해 틀리게 설명한 것은?","opts":["가입 시 선택한 펀드에 대해 통상 1년에 12번 이내에서 다른 유형으로 변경할 수 있다.","펀드 변경 시에는 별도의 수수료가 부과될 수 있다.","변액보험 판매 시 펀드변경에 대해 계약자에게 설명해야 한다.","반드시 보험회사에 방문하여 본인 확인 후 펀드변경 신청서를 작성해야 한다."],"answer":3,"expl":"④ 보험회사에 방문하는 방법뿐만 아니라 인터넷, 전화, 모바일 앱 등의 방법으로 펀드변경을 할 수 있다."},{"id":1017,"s":2,"type":"mc","q":"다음 중 상환기간에 따라 분류할 경우 중기에 해당하는 채권은 무엇인가?","opts":["통화안정증권","외국환평형기금채권","국민주택채권","도시철도채권"],"answer":1,"expl":"② 외국환평형기금채권이 중기채이다.\n* 통화안정증권은 단기채이며, 국민주택채권과 도시철도채권은 장기채에 해당된다."},{"id":1018,"s":2,"type":"mc","q":"다음 중 보험차익의 비과세의 계약기간 기산일 변경사유에 해당하지 않는 것은?","opts":["수익자를 변경한 경우","계약자 명의가 변경되는 경우","보장성보험을 저축성보험으로 변경하는 경우","최초 계약한 기본보험료의 1배를 초과하여 기본보험료를 증액하는 경우"],"answer":0,"expl":"① 수익자를 변경한 경우는 기산일 변경사유가 아니다.\n* 계약자를 변경(사망으로 인한 변경은 제외)한 경우는 기산일 변경사유에 해당한다.","tb":[]},{"id":1019,"s":2,"type":"mc","q":"다음 중 변액보험의 보험계약대출에 대해 맞게 설명한 것은?","opts":["보험계약자가 납입한 보험계약대출이자 전액이 특별계정 재원으로 투입된다.","보험계약자는 이미 납입한 보험료에 배당하는 금액만큼 보험계약대출을 받을 수 있다.","보험계약자는 보험계약대출금 및 이자를 언제든지 상환할 수 있다.","대출원리금은 상환일에 즉시 특별계정 펀드로 투입된다."],"answer":2,"expl":"보험계약대출금과 이자는 언제든지 상환할 수 있다(③). 상환금액은 상환일 즉시가 아니라 영업일 기준으로 특별계정에 반영되고, 대출이자 전액이 특별계정 재원이 되는 것도 아니다."},{"id":1020,"s":2,"type":"mc","q":"다음 중 변액보험의 투자수익률과 순수익률의 차이를 발생시키는 원인이 아닌 것은?","opts":["최저보증비용","특별계정 운용보수","공시이율","기타비용"],"answer":2,"expl":"③ 공시이율\n* 순수익률 = 투자수익률 - (최저보증비용, 특별계정 운용보수, 기타비용 등)"},{"id":1021,"s":2,"type":"mc","q":"다음 중 환매조건부채권(RP)에 대해 틀리게 설명한 것은?","opts":["「예금자보호법」에 의한 보호대상 금융상품이다.","한국은행이 민간 금융회사에 매도하는 경우 한국은행 기준금리를 적용한다.","환매조건부채권 매도자는 채권 매각에 따른 자본손실 위험을 피할 수 있다.","투자자는 단기 여유자금을 안전하게 운용할 수 있다."],"answer":0,"expl":"① 환매조건부채권은 「예금자보호법」에 의한 보호대상 금융상품이 아니다."},{"id":1022,"s":2,"type":"mc","q":"다음 중 금리의 기능에 대해 틀리게 설명한 것은?","opts":["현재 소비와 장래 소비 배분 기능","과열된 경기 조절 기능","합리적으로 자금을 배분하는 기능","물가 상승을 통한 국가 경제 성장 기능"],"answer":3,"expl":"④ 물가 상승을 통한 국가 경제 성장 기능은 없다."},{"id":1023,"s":2,"type":"mc","q":"다음 표에서 설명하는 용어는 무엇인가?","tb":["적대적 인수합병 시도가 있는 경우 기업의 경영권 방어를 위하여 기존의 주주들에게 시가보다 저렴한 가격으로 지분을 매수할 수 있는 권리를 부여하는 제도"],"opts":["스타트업","포이즌필","차등의결권","엔젤투자"],"answer":1,"expl":"② 포이즌필에 대한 설명이다."},{"id":1024,"s":2,"type":"mc","q":"다음 중 변액보험에 대한 설명으로 틀린 것은?","opts":["변액종신보험의 보험료 납입방법은 월납과 연납만이 가능하다.","변액연금보험은 금리연동형 연금보험과 동일한 형태로 보험계약자가 납입보험료 수준, 납입기간, 납입방법을 선택한다.","변액유니버설보험에는 연금전환특약을 부가할 수 있다.","변액유니버설보험은 의무납입기간 이후에는 정해진 납입기간 없이 보험기간 중 보험계약자가 원하는 때에 보험료를 납입할 수 있다."],"answer":0,"expl":"① 변액종신보험의 보험료 납입방법은 월납과 일시납만이 가능하다."},{"id":1025,"s":2,"type":"mc","q":"다음 중 「예금자보호법」에 의해 가장 많은 금액을 보호받을 수 있는 경우는?","opts":["상호저축은행 – 저축예금 3천만원","은행 – 뮤추얼펀드 5천만원","손해보험회사 – 보증보험계약 4천만원","은행 – 외화예금 2천만원"],"answer":0,"expl":"① 상호저축은행 - 저축예금 3천만원\n* 뮤추얼펀드와 보증보험은 비보호 금융상품이다.","tb":[]},{"id":1026,"s":2,"type":"mc","q":"다음 표에서 설명하고 있는 근로자의 세액공제액(지방소득세 별도)은 얼마인가?","tb":["• 총급여액 5,000만원(근로소득 이외의 소득이 없음)","• 연금저축계좌에 납입한 금액이 연 700만원이다.","• 확정급여형(DB형) 퇴직연금에 납입된 금액이 연 400만원이다.","• 개인형 퇴직연금(IRP)에 납입된 금액이 연 200만원이다."],"opts":["120만원","105만원","84만원","60만원"],"answer":0,"expl":"① 120만원\n* 근로소득만 있는 경우 총 급여액 5,500만원 이하이므로 세액공제율은 15% 적용\n* 연금저축계좌 600만원 + IRP 납입액 200만원 공제 가능 ▶ 800만원 x 15% = 120만원\n* 확정급여형(DB형)은 연금계좌에 포함되지 않음"},{"id":1027,"s":2,"type":"mc","q":"다음 중 변액보험에 대해 맞게 설명한 것은?","opts":["납입보험료 전액이 실적배당을 위해 유가증권 등에 투자된다.","적립금에 최저보증이율이 있다.","변동보험금액은 최저보증금액 산정의 기초가 된다.","특별계정의 자산평가와 정산은 매일 실시한다."],"answer":3,"expl":"특별계정의 자산평가와 정산은 매일 실시한다(④ 맞음). 납입보험료 전액이 투자되는 것은 아니고(사업비 등 공제), 적립금에 최저보증이율은 없다(해설)."},{"id":1028,"s":2,"type":"mc","q":"다음 중 우리나라의 변액보험 도입 및 법적 규제에 대해 틀리게 설명한 것은?","opts":["2003년 교차모집 제도의 시행과 더불어 변액보험이 도입되었다.","변액보험의 정의는 「보험업법」에 명시되어 있다.","변액보험 특별계정(펀드)은 「자본시장법」상 집합투자기구로 본다.","손해보험회사는 변액보험을 판매할 수 없다."],"answer":0,"expl":"① 변액보험 도입과 교차모집 제도의 시행과는 관련성이 없다."},{"id":1029,"s":2,"type":"mc","q":"다음 중 변액보험의 현금흐름에 대한 설명으로 틀린 것은?","opts":["납입보험료 중 순보험료는 일반계정에서 운용된다.","납입 후 계약유지비용은 보험료 납입기간 중 미리 모두 받는다.","납입보험료 중 일부가 특별계정에서 운용된다.","위험보험료를 특별계정에서 차감하여 일반계정으로 보낸다."],"answer":0,"expl":"① 납입보험료 중 순보험료는 특별계정에 투입되어 운용된다."},{"id":1030,"s":2,"type":"mc","q":"다음 중 변동보험금 계산 방법의 하나인 일시납보험 추가가입방법에 대해 틀리게 설명한 것은?","opts":["변액연금보험에 사용되는 방법이다.","투자수익률이 좋을 경우 변동보험금이 크게 증가할 수 있다.","계산방법이 복잡하여 완전판매가 될 수 있도록 주의가 필요하다.","우리나라 변액보험의 변동보험금은 월 1회 변동한다."],"answer":0,"expl":"① 일시납보험 추가가입방법은 변액종신보험과 변액유니버셜보험(보장형)에 사용된다.","tb":[]},{"id":1031,"s":2,"type":"mc","q":"다음 표의 ( ) 안에 들어갈 숫자로 맞는 것은?","tb":["보험계약 해지 시 계약자 적립금에서 해약공제금액을 차감하여 보험계약자에게 지급하며, 해약공제금액은 Min(납입기간, ( )년)간 발생한다."],"opts":["1","3","5","7"],"answer":3,"expl":"④ 최대 7년간 해약공제액이 발생한다."},{"id":1032,"s":2,"type":"mc","q":"다음 중 금융소득의 과세방법에 대해 맞게 설명한 것은?","opts":["금융소득을 포함한 종합소득 과세표준이 5억원을 초과 10억원 이하인 경우 적용되는 소득세율은 35%(지방소득세 별도)이다.","만기가 10년 이상인 장기채권(3년 이상 보유)에서 발생하는 이자는 무조건 종합과세 대상이다.","비과세 및 분리과세 소득을 제외한 금융소득이 2천만원을 초과하는 경우에는 종합과세한다.","금융소득 종합과세 여부는 부부의 금융소득 합계액을 기준으로 판단한다."],"answer":2,"expl":"비과세·분리과세 소득을 제외한 금융소득이 연 2천만원을 초과하면 종합과세한다(③ 맞음). 과세표준 5억~10억 구간 세율은 42%(35% 아님)이고, 종합과세 여부는 개인별로 판단한다(해설)."},{"id":1033,"s":2,"type":"mc","q":"다음 표에서 생명보험 세제에 대한 설명으로 틀린 것을 모두 고른 것은?","tb":["(가) 연금계좌 세액공제는 근로소득자만을 대상으로 한다.","(나) 피보험자의 사망으로 보험수익자가 지급받는 보험금의 보험차익도 과세대상이다.","(다) 사적연금소득 합계액이 연 1,500만원 이하인 경우 분리과세를 선택할 수 있다."],"opts":["(가)","(가), (나)","(나), (다)","(가), (다)"],"answer":1,"expl":"② (가), (나)\n* (가) 연금계좌 세액공제는 종합소득이 있는 거주자에게 적용된다.\n* (나) 피보험자 사망으로 보험수익자가 받는 보험금은 실질 보험료 납입자에 따라 상속세 및 증여세 등이 과세될 수 있다. 또한 사망보험금은 저축성보험이 아니므로 보험차익에 대해 과세되는 것이 아니다."},{"id":1034,"s":2,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 폐지사유에 해당하지 않는 것은?","opts":["펀드 자산가치의 변화로 인해 효율적 자산운용이 곤란해진 경우","설정 후 1년이 지난 펀드가 1개월간 계속하여 설정액이 50억원에 미달하는 경우","펀드의 운용대상이 소멸한 경우","펀드개설 후 10년 이상 경과한 경우"],"answer":3,"expl":"④ 10년이 경과했다는 이유로 펀드를 폐지하는 것은 아니다.","tb":[]},{"id":1035,"s":2,"type":"mc","q":"다음 중 위험프리미엄과 관련하여 맞게 설명한 것은?","opts":["금융시장의 위험수준이 낮을수록 투자자들이 요구하는 위험프리미엄이 낮아진다.","투자수익률은 위험프리미엄과 관계가 없다.","주식보다 채권을 선호하는 투자자는 위험회피도가 낮다.","투자자는 자신이 부담하는 위험에 상응하는 보상을 받고자 하는데 이를 위험프리미엄이라고 한다."],"answer":3,"expl":"위험프리미엄은 위험 부담에 상응하는 보상이다(④ 맞음). 채권 등 안전자산을 선호하는 투자자는 위험회피도가 높다(③ 틀림, 해설)."},{"id":1036,"s":2,"type":"mc","q":"다음 표에서 설명하는 용어로 맞는 것은? 중국 내 임금 및 원자재 값 상승 등으로 중국 제품의 수출단가가 오르면서 중국산 수입 의존도가 높은 국가의 물가를 자극하는 현상","tb":[],"opts":["스태그플레이션(Stagflation)","차이나플레이션(Chinaflation)","차이나디스카운트(China Discount)","디플레이션(Deflation)"],"answer":1,"expl":"② 차이나플레이션에 대한 설명이다."},{"id":1037,"s":2,"type":"mc","q":"다음 중 변액보험의 납입보험료의 처리에 대한 설명으로 틀린 것은?","opts":["보험료 추가 납입 시 납입일 + 제2영업일에 특별계정으로 투입된다.","선납보험료는 월 계약해당일까지 평균공시이율로 적립한다.","제1회 보험료는 납입일 + 제2영업일에 특별계정으로 투입된다.","변액유니버셜보험의 경우 의무납입기간 이후 납입보험료에서 기타비용만 차감하여 특별계정으로 투입한다."],"answer":2,"expl":"③ 청약철회종료일 전에 성립 : 청약철회종료일 + 제1영업일에, 청약철회종료일 이후에 성립 : 승낙일"},{"id":1038,"s":2,"type":"mc","q":"다음 중 주식 상장의 효과에 대해 틀리게 설명한 것은?","opts":["회사의 공신력 제고","주식의 유동성 증가","자금조달의 용이성 확대","소유주식의 집중도 증가"],"answer":3,"expl":"④ 소유주식의 집중도가 해소된다.(분산효과)"},{"id":1039,"s":2,"type":"mc","q":"다음 중 금융시장 및 금융상품에 대해 틀리게 설명한 것은?","opts":["단기금융시장은 자금시장이라고도 한다.","일반적으로 장기금융상품은 단기금융상품보다 기대수익률이 높다.","단기금융상품은 거래가 대규모로 이루어지고 유동성이 높다.","금융상품의 만기 3년을 기준으로 장·단기 금융시장을 구분한다."],"answer":3,"expl":"④ 금융상품의 만기 1년을 기준으로 장단기 금융시장을 구분한다."},{"id":1040,"s":2,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 계약자 보유좌수를 감소시키는 요인이 아닌 것은?","opts":["적립금 중도인출","기준가격 하락","보험가입금액 감액","월대체보험료 차감"],"answer":1,"expl":"② 기준가격이 변동되더라도 좌수가 변하는 것은 아니다.","tb":[]}];

window.QUESTIONS3=[{"id":2001,"s":3,"type":"ox","q":"변액보험의 법률상 정의는 보험금이 자산운용성과에 따라 변동하는 보험계약이다. (  )","answer":"O","expl":"(O) 맞는 설명이다.","tb":[]},{"id":2002,"s":3,"type":"ox","q":"보험회사는 보장개시일로부터 5년 이내 (사기 사실을 안 날로 부터 1개월 이내) 뚜렷한 사기에 의하여 계약이 성립된 것을 증명하는 경우 계약을 취소할 수 있다. (  )","answer":"O","expl":"(O) 맞는 설명이다.","tb":[]},{"id":2003,"s":3,"type":"ox","q":"확실성이 높지만 낮은 수익을 가져오는 금융상품을 더 선호하는 투자자는 '위험회피도가 낮다'고 한다. (  )","answer":"X","expl":"(X) 위험회피도가 낮다 → 위험회피도가 높다","tb":[]},{"id":2004,"s":3,"type":"ox","q":"변액종신보험의 계약체결비용은 납입기간 이후에도 매월 계약해당일에 특별계정(펀드)에서 일반계정으로 차감한다. (  )","answer":"X","expl":"(X) 계약체결비용은 특별계정 투입보험료가 아니며, 특별계정에서 차감되는 비용이 아니다.","tb":[]},{"id":2005,"s":3,"type":"mc","q":"다음 중 변동보험금을 일시납보험 추가가입방법으로 계산하는 변액보험상품을 맞게 모두 고른 것은?","tb":["(가) 변액연금보험","(나) 변액종신보험","(다) 변액유니버설보험(적립형)","(라) 변액유니버설보험(보장형)"],"opts":["(가), (나)","(가), (다)","(다), (라)","(나), (라)"],"answer":3,"expl":"④ (나), (라)"},{"id":2006,"s":3,"type":"mc","q":"다음 표의 ( ) 안에 들어갈 내용을 순서대로 맞게 나열한 것은?","tb":["변액보험 특별계정(펀드) 자산은 ( 가 )에 의해 평가하며, 운용자산은 원칙적으로 ( 나 ) 평가한다. |"],"opts":["(가) 시가법, (나) 매일","(가) 원가법, (나) 매월","(가) 시가법, (나) 매년","(가) 원가법, (나) 매일"],"answer":0,"expl":"① (가) 시가법, (나) 매일"},{"id":2007,"s":3,"type":"mc","q":"다음 중 변액보험의 현금흐름에 대해 맞게 설명한 것은?","opts":["특별계정에서 운용되는 보험료는 납입보험료 전액이다.","계약관리비용 및 계약유지비용은 보험료 납입기간에만 사용하는 사업비다.","일시납계약은 보험료 납입 이후 별도의 계약유지비용이 없다.","일반적으로 보험료 납입기간 이후의 계약유지비용은 보험료 납입기간에 미리받게 된다."],"answer":3,"expl":"① 특별계정에서 운용되는 보험료는 납입보험료의 일부이다.\n② 납입기간이 끝난 이후에는 계약 후 유지비용이 발생한다.\n③ 일시납계약은 보험료 납입 이후 계약유지비용은 계속해서 발생하며, 일시납보험료로 미리 받게된다.","tb":[]},{"id":2008,"s":3,"type":"mc","q":"다음 중 변액보험 운용설명서에서 확인할 수 있는 항목이 아닌 것은?","opts":["미래의 예상수익률","상품의 개요","변액보험 운용흐름","특별계정 보수 및 비용"],"answer":0,"expl":"① 미래의 예상수익률"},{"id":2009,"s":3,"type":"mc","q":"다음 중 합성채권에 대해 틀리게 설명한 것은?","opts":["교환사채는 교환권 청구시 추가적인 자금 부담이 없다는 점에서 신주인수권부사채와 동일한 성격을 가진다.","전환사채는 주식으로 전환될 경우 채권의 효력이 없어진다.","신주인수권부사채는 신주인수권 행사 후에도 채권자의 지위를 유지한다.","교환사채는 자본금의 증가가 수반되지 않는다는 점에서 전환사채와 다르다."],"answer":0,"expl":"① 교환사채는 추가적인 자금 부담이 없지만, 신주인수권부사채는 추가적인 자금 부담이 있다."},{"id":2010,"s":3,"type":"mc","q":"다음 표에서 설명하는 금융시장은 무엇인가?","tb":["기업어음시장의 단점을 보완하고 중장기적으로 기업어음시장을 대체하기 위해 2013년 1월 도입된 시장 |"],"opts":["표지어음시장","단기사채시장","통화안정증권시장","양도성예금증서시장"],"answer":1,"expl":"② 단기사채시장"},{"id":2011,"s":3,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 수익률에 대해 맞게 설명한 것은?","opts":["펀드 최초 개설일 대비 오늘까지의 특별계정 수익률을 연환산수익률이라 한다.","펀드 설정일부터 오늘까지 총 경과일수동안의 수익률을 1년(365일)으로 환산한 것을 누적수익률이라 한다.","변액보험의 연환산수익률은 투자실적이 악화될 경우 (-)수익률이 가능하다.","펀드 설정 후 1년 이내인 펀드에 대해서도 연환산수익률을 공시하도록 하고 있다."],"answer":2,"expl":"① 누적수익률 ② 연환산수익률 ④ 설정 후 1년 이내인 펀드는 연환산수익률을 공시하지는 않는다.","tb":[]},{"id":2012,"s":3,"type":"mc","q":"다음 중 유가증권 상장시 회사에 미치는 긍정적인 효과에 해당하지 않는 것은?","opts":["주식의 유동성 증가","담보가치의 향상","소유주식의 집중","용이한 자금조달"],"answer":2,"expl":"③ 소유주식의 집중 → 완화","tb":[]},{"id":2013,"s":3,"type":"mc","q":"다음 표에서 변액종신보험의 사망보험금은 얼마인가?","tb":["상품가입 및 사고현황 | 일자별 변동보험금 |","• 가입상품 : 변액종신보험 | |","• 사망보험금 : 1억원 + 청구 시점의 변동보험금 | • '21.3.10 : 3,000만원 |","• 사망일자 : '21.3.10 | • '21.4.10 : 3,500만원 |","• 보험금 청구일자 : '21.5.10 | • '21.5.10 : 2,900만원 |"],"opts":["1억 2천 9백만원","1억 3천 5백만원","1억 3천만원","1억원"],"answer":0,"expl":"① 1억2천9백만원 (= 1억원 + 2,900만원(청구시점의 변동보험금))"},{"id":2014,"s":3,"type":"mc","q":"다음 중 변액보험의 자산운용에 대해 맞게 설명한 것은?","opts":["특별계정(펀드)은 안정성 위주로 자산을 운용한다.","보험계약자는 펀드변경을 통해 자산운용에 대한 간접선택권을 가진다.","특별계정(펀드)과 일반계정의 자산간 상호 매매·교환이 가능하다.","매일 공시이율을 산출하고 그 성과를 계약자적립금에 반영한다."],"answer":1,"expl":"① 안정성 → 수익성 ③ 상호 매매·교환이 불가능하다. ④ 공시이율 → 투자수익률"},{"id":2015,"s":3,"type":"mc","q":"다음 중 「자본시장법」상 금융투자업자의 고유업무에 해당하지 않는 것은?","opts":["신탁업","투자중개업","집합투자업","내외국환업무"],"answer":3,"expl":"④ 내외국환업무는 금융투자업에 해당하지 않는다."},{"id":2016,"s":3,"type":"mc","q":"다음 중 종합소득으로 과세하는 소득이 아닌 것은?","opts":["사업소득","근로소득","양도소득","연금소득"],"answer":2,"expl":"③ 양도소득은 분류과세 소득이다."},{"id":2017,"s":3,"type":"mc","q":"다음 중 변액보험의 보험계약대출에 대해 맞게 설명한 것은?","opts":["보험계약대출이자는 전액 특별계정(펀드)으로 투입된다.","보험계약자는 이미 납입한 보험료 범위 내에서 대출을 받을 수 있다.","상환된 보험계약대출금은 매월 계약해당일에 특별계정(펀드)으로 이체된다.","보험회사는 계약해지시 해약환급금에서 대출원리금을 차감한 후 지급할 수 있다."],"answer":3,"expl":"① 보험계약대출이자에서 보험계약대출수수료를 차감한 일부가 특별계정(펀드)으로 투입된다.\n② 보험계약자는 해약환급금 범위 내에서 대출을 받을 수 있다.\n③ 상환된 보험계약대출금은 상환일 + 제2영업일에 특별계정(펀드)으로 이체된다."},{"id":2018,"s":3,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 자산운용옵션에 대해 틀리게 설명한 것은?","opts":["펀드 자동재배분 기능에서 펀드별 투자비율은 계약체결시에만 설정 가능하다.","펀드변경을 통해 보험회사는 보험계약자에게 자산운용에 대한 간접선택권을 부여한다.","보험료 평균분할 투자기능을 이용해 보험계약자는 리스크의 분산을 도모할 수 있다.","보험료 평균분할 투자기능은 주로 고액자금을 일시에 납입할 경우 활용된다."],"answer":0,"expl":"① 펀드 자동재배분 기능에서 펀드별 투자비율은 계약체결 시 뿐만 아니라 유지 중에도 설정 가능하다.","tb":[]},{"id":2019,"s":3,"type":"mc","q":"다음 표에서 설명하는 용어는 무엇인가?","tb":["생명보험업계에서 고소득 설계사들이 모인 전문가 단체로, 백만불 원탁회의를 일컫는 용어 |"],"opts":["MMDA","VVIP","MDRT","IFRS"],"answer":2,"expl":"MDRT에 대한 설명이다."},{"id":2020,"s":3,"type":"mc","q":"다음 중 금융소득의 과세방법에 대해 틀리게 설명한 것은?","opts":["금융소득 종합과세 여부는 개인별 연간금융소득의 합계액으로 판단한다.","분리과세되는 금융소득 원천징수로 납세의무가 종결된다.","금융소득은 이자소득과 배당소득을 총칭하는 개념이다.","비과세 요건을 충족하지 못한 저축성보험의 보험차익은 분류과세한다."],"answer":3,"expl":"비과세 요건을 충족하지 못한 저축성보험의 보험차익 이자소득으로 보아 분리과세되고, 다른 금융소득과 합계한 금액이 2천만원을 초과하면 종합과세된다."},{"id":2021,"s":3,"type":"mc","q":"다음 표에서 연금계좌 세액공제액(지방소득세 별도)으로 맞는 것은?","tb":["• 종합소득금액 : 6천만원 |","• 연금저축계좌 납입액 : 8백만원 |","• 개인형 퇴직연금계좌 납입액 : 3백만원 |"],"opts":["80만원","90만원","108만원","120만원"],"answer":2,"expl":"108만원 (= (600만원+300만원) × 12%)"},{"id":2022,"s":3,"type":"mc","q":"다음 중 변액유니버셜보험에 대해 맞게 설명한 것은?","opts":["해약환급금에서 위험보험료 등을 충당할 수 없을 경우 기본보험금액이 감액된다.","적립형의 사망보험금은 이미 납입한 보험료를 최저 보증하며 매년을 주기로 변동한다.","변액유니버셜보험의 보험료납입기간은 보험기간보다 길다.","의무납입기간 이후에는 기본보험료의 납입을 일시중지할 수 있다."],"answer":0,"expl":"① 해약환급금에서 위험보험료 등을 충당할 수 없을 경우 납입최고절차를 진행하게 된다.\n② 매년 → 매일\n③ 변액유니버설보험의 보험료납입기간은 보험기간과 같은 전기납 종신이다.","tb":[]},{"id":2023,"s":3,"type":"mc","q":"다음 중 금융통화위원회의 금리정책에 대해 맞는 설명을 모두 묶은 것은?","tb":["(가) 한국은행 금융통화위원회는 기준금리를 결정한다.","(나) 기준금리의 결정은 6개월에서 12개월의 시차를 두어 콜금리에 영향을 미친다.","(다) 한국은행은 통화정책 운영체계로서 물가안정목표제를 채택하고 있다."],"opts":["(가), (나)","(나), (다)","(가), (다)","(가), (나), (다)"],"answer":2,"expl":"(가), (다)\n* (나) 콜금리에는 즉시 영향을 미친다."},{"id":2024,"s":3,"type":"mc","q":"다음 중 변액연금보험에 대해 맞게 설명한 것은?","opts":["다양한 최저보증옵션으로 인해 중도해지시에도 원금 손실은 발생하지 않는다.","변액종신보험과 달리 특정 장해상태시 납입면제기능이 있는 것이 일반적이다.","펀드의 운용실적에 따라 해약환급금이 매일 변동한다.","저축성 보험이므로 최저사망보험금 보증은 적용되지 않는다."],"answer":0,"expl":"① 중도해지 시에는 원금손실이 발생할 수 있다.(해약환급금은 최저보증이 없음)\n② 변액종신보험과 달리 특정 장해상태시 납입면제기능이 없는 것이 일반적이다.\n④ 모든 변액보험에는 최저사망보험금 보증이 적용된다.","tb":[]},{"id":2025,"s":3,"type":"mc","q":"다음 중 변액보험의 부활(효력회복)에 대해 맞게 설명한 것은?","opts":["부활시 특별계정(펀드)에서 관리하던 해약환급금을 일반계정으로 투입한다.","해약환급금 수령일로부터 3년 이내에 계약의 부활을 청구할 수 있다.","부활시 연체보험료 외에 별도의 연체이자는 납입할 필요가 없다.","부활시 계약자 적립금은 해지된 시점의 계약자 적립금을 기준으로 한다."],"answer":0,"expl":"① 부활시 일반계정에서 관리하던 해약환급금을 특별계정(펀드)으로 투입한다.\n② 해약환급금 해지된 날부터 3년 이내에 계약의 부활을 청구할 수 있다.(해약환급금 수령시 부활 불가능)\n③ 부활시 연체보험료 외에 평균공시이율+1% 범위 내에서 회사가 정한 이율로 계산한 이자를 납입한다."},{"id":2026,"s":3,"type":"mc","q":"다음 중 변액보험 주요내용 확인서의 내용으로 틀린 것은?","opts":["특별계정의 운용에 따른 이익과 손실이 계약자에게 귀속된다는 내용","투자형 상품이므로 원금도달기간은 예시할 수 없다는 내용","납입보험료 중 수수료 등이 제외된 금액이 특별계정으로 투입된다는 내용","사망보험금과 해약환급금이 매일 변동된다는 내용"],"answer":1,"expl":"원금도달기간이 장기이며, 원금도달예상기간은 평균공시이율을 가정하여 예시한다."},{"id":2027,"s":3,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 채권형 펀드에 대해 틀리게 설명한 것은?","opts":["채권 관련 파생상품에 투자하지 않는다.","양도성예금증서(CD), 콜론(Call Loan) 등에 투자할 수 있다.","안정적인 수익 획득을 목적으로 하므로 주식에 투자하지 않는다.","전환사채, 교환사채 등에 투자할 수 있다."],"answer":0,"expl":"채권 관련 파생상품에 투자할 수 있다.","tb":[]},{"id":2028,"s":3,"type":"mc","q":"다음 중 거래소 정규시장에서 동시호가의 경우 적용되지 않는 매매거래 원칙은?","opts":["가격우선의 원칙","시간우선의 원칙","수량우선배분의 원칙","위탁매매우선의 원칙"],"answer":1,"expl":"시간우선의 원칙"},{"id":2029,"s":3,"type":"mc","q":"다음 중 변액보험의 추가납입보험료와 선납보험료에 대해 틀리게 설명한 것은?","opts":["추가납입보험료 계약체결시 납입하기로 한 기본보험료 이외에 수시로 납입할 수 있는 보험료이다.","선납보험료는 납입일+제2영업일에 특별계정으로 투입된다.","추가납입보험료는 계약자가 더 많은 수익을 얻을 수 있는 기회를 제공한다.","보험료 선납은 실적배당형 상품의 본래 특성의 약화 및 불완전판매 가능성이 있다."],"answer":1,"expl":"선납보험료는 매월 계약해당일에 특별계정으로 투입된다."},{"id":2030,"s":3,"type":"mc","q":"다음 중 표의 ( ) 안에 들어갈 용어로 적절한 것은? 3이원방식에 의한 보험료 산출에 따르면, ( )이 낮아지면 사망보험의 보험료는 올라가게 되고, ( )이 높아지면 사망보험의 보험료는 내려가게 된다.","tb":[],"opts":["예정위험율","예정이율","예정사업비율","예정해지율"],"answer":1,"expl":"예정이율"},{"id":2031,"s":3,"type":"mc","q":"다음 중 보험회사의 수시공시 항목을 모두 고른 것은?","tb":["(가) 당기순손익","(나) 불완전판매비율","(다) 적기시정조치 사항","(라) 소송에 의한 거액의 손실"],"opts":["(가), (나)","(가), (다)","(나), (다)","(다), (라)"],"answer":3,"expl":"(다), (라)"},{"id":2032,"s":3,"type":"mc","q":"다음 중 생명보험계약에 대해 맞게 설명한 것은?","opts":["보험증권 교부는 보험계약의 성립요건이다.","제1회 보험료가 납부되어야 보험계약이 성립한다.","보험료 납입과 보험금 지급은 대가관계에 있다.","사람의 생사를 보험사고로 하므로 채권계약이 아니다."],"answer":0,"expl":"① 보험증권 교부는 보험계약의 성립요건이 아니다.\n② 보험계약자의 청약에 보험회사의 승낙으로 보험계약이 성립한다.\n④ 보험료 납입과 보험사고시 보험금 지급이라는 채권계약의 성격도 있다."},{"id":2033,"s":3,"type":"mc","q":"다음 중 변액종신보험에 대해 맞게 설명한 것은?","opts":["해약환급금은 월 1회 재계산된다.","장해지급률 80%인 장해상태시 사망보험금을 지급하고 계약이 소멸한다.","(-)변동보험금이 발생하는 경우, 사망보험금이 기본보험금 이하로 감소한다.","계약자적립금에 대해 최저보증이율이 없다."],"answer":0,"expl":"① 해약환급금은 투자수익률에 따라 매일 변동한다.\n② 장해지급률 80%인 장해상태시 장해보험금을 지급하고 계약이 유지된다.\n③ (-)변동보험금이 발생하더라도 사망보험금은 기본보험금 이하로 감소하지 않는다."},{"id":2034,"s":3,"type":"mc","q":"다음 중 변액연금보험의 최저중도인출금보증(GMWB)에 대해 맞게 설명한 것은?","opts":["사망시점 이전의 투자실적에 관계없이 사망보험금 최저보증","연금개시 이전의 투자실적에 관계없이 연금적립금 최저보증","보험기간 중 일정기간 동안 보험가입금액의 일부비율을 투자실적에 관계없이 예정최저적립금의 일정수준만큼 인출할 수 있도록 최저보증","연금개시 이후 투자실적에 관계없이 사망시점까지 일정수준의 인출금 최저보증"],"answer":0,"expl":"GMDB, ② GMAB, ④ GLWB","tb":[]},{"id":2035,"s":3,"type":"mc","q":"다음 중 일반계정과 특별계정(변액보험)의 비교로 틀린 것은?","tb":["종류 | 특별계정 (변액보험) | 일반계정 |","(가) 자산평가시기 | 매일 | 매월 |","(나) 자산운용목적 | 수익성 위주 | 안정성 위주 |","(다) 최저보증이율 | 없음 | 있음 |","(라) 리스크부담 | 자산운용사 부담 | 보험회사 부담 |"],"opts":["(가) 자산평가 시기","(나) 자산운용목적","(다) 최저보증이율","(라) 리스크부담"],"answer":3,"expl":"(라) 리스크부담 : 특별계정은 계약자 부담"},{"id":2036,"s":3,"type":"mc","q":"다음 중 변액연금보험에 대하여 틀리게 설명한 것은?","opts":["생명보험회사에서만 판매할 수 있는 상품이다.","연금계좌 세액공제 대상이다.","일정 요건을 충족한 경우 보험차익 비과세 혜택이 있다.","발생한 소득은 이자소득으로 분류된다."],"answer":1,"expl":"변액연금보험은 연금계좌 세액공제 대상이 아니다.","tb":[]},{"id":2037,"s":3,"type":"mc","q":"다음 표에서 설명하는 용어로 맞는 것은? 미국 캘리포니아 주 샌프란시스코만 남단의 산타클라라 계곡지대에 위치한 미국의 유력한 전자, 컴퓨터, 소프트웨어 관련 산업이 집중된 공업지역","tb":[],"opts":["나파밸리","테헤란밸리","스푼밸리","실리콘밸리"],"answer":3,"expl":"실리콘밸리에 대한 설명이다."},{"id":2038,"s":3,"type":"mc","q":"다음 표에서 변액보험의 제1회 보험료가 특별계정(펀드)으로 투입되는 시점은 언제인가?","tb":["• 청약일 : 11월 1일","• 제1회 보험료 납입일 : 11월 2일","• 승낙일 : 11월 10일","• 청약철회 종료일 : 12월 1일"],"opts":["11월 10일","11월 11일","12월 1일","12월 2일"],"answer":3,"expl":"12월 2일 (= 청약철회기간 종료일 + 제1영업일)"},{"id":2039,"s":3,"type":"mc","q":"다음 중 변액보험의 계약내용 변경에 대해 틀리게 설명한 것은?","opts":["기본보험금액과 변동보험금액을 각각 다른 비율로 감액할 수 있다.","보험가입금액 감액 시 보험회사는 감액된 부분에 해당하는 해약환급금을 계약자에게 지급한다.","보험계약자는 보험회사의 승낙을 얻어 보험종목을 변경할 수 있다.","보험계약자는 필요한 경우 자산운용옵션을 변경할 수 있다."],"answer":0,"expl":"기본보험금액과 변동보험금액을 각각 다른 비율로 감액할 수 없다."},{"id":2040,"s":3,"type":"mc","q":"다음 중 우리나라의 변액보험 도입 및 경과에 대해 맞게 설명한 것은?","opts":["2008년 금융위기 시 변액보험 판매가 증가하였다.","2009년 「자본시장법」이 시행되면서 변액보험의 법적 근거가 마련되었다.","2000년 보험가격 자유화 이후 인플레이션 헤지를 위해 상품도입이 추진되었다.","변액연금보험이 가장 먼저 도입되었다."],"answer":0,"expl":"① 2008년 금융위기 시 변액보험 판매가 감소하였다.\n② 변액보험 도입의 법적근거는 「보험감독규정」, 「보험업법」에 변액보험계약 문구가 정식으로 반영\n④ 변액종신보험이 가장 먼저 도입되었다."}];

window.QUESTIONS4=[{"id":3001,"s":4,"type":"ox","q":"한국은행 금융통화위원회는 물가동향, 국내외 경제상황, 금융시장 여건 등을 종합적으로 고려하여 매월 기준금리를 결정한다. (   )","answer":"X","expl":"(X) 기준금리는 연 8회 결정한다.","tb":[]},{"id":3002,"s":4,"type":"ox","q":"계속보험료를 납입하지 못하여 계약이 해지되었으나 해약환급금이 지급되지 않는 경우, 해지된 날로부터 3년 이내에 보험사가 정하는 절차에 따라 부활을 청구할 수 있다. (   )","answer":"O","expl":"(O) 맞는 설명이다.","tb":[]},{"id":3003,"s":4,"type":"ox","q":"변액보험 최저사망보험금 보증비용은 매일 동일한 금액이 특별계정에서 일반계정으로 차감된다. (   )","answer":"X","expl":"(X) 최저사망보험금 보증비용은 매월 계약해당일에 차감된다.","tb":[]},{"id":3004,"s":4,"type":"ox","q":"변액유니버셜보험(적립형)과 변액종신보험의 변동보험금 계산방법은 동일하다. (   )","answer":"X","expl":"(X) 저축성변액보험과 보장성변액보험의 변동보험금 계산방법은 서로 다르다.","tb":[]},{"id":3005,"s":4,"type":"mc","q":"다음 표의 ( )에 들어갈 내용으로 맞는 것은?","tb":["보험회사는 사업연도 말 결산일로부터 ( ) 이내에 「생명보험 경영통일공시기준」에서 정한 정기공시 항목의 내용을 공시해야 한다. |"],"opts":["1개월","2개월","3개월","4개월"],"answer":2,"expl":"③ 3개월"},{"id":3006,"s":4,"type":"mc","q":"다음 중 변액보험 특별계정 투입보험료에 대해 맞게 설명한 것을 모두 고른 것은?","tb":["(가) 보험계약자가 납입하는 제1회 보험료는 즉시 특별계정(펀드)으로 투입된다. |","(나) 변액연금보험 특별계정(펀드) 투입보험료는 납입보험료에서 계약체결비용 및 계약관리비용 등을 차감한 것이다. |","(다) 변액보험 특약보험료는 전액 일반계정에서 운용되며, 특별계정(펀드)과는 무관하게 운용된다. |"],"opts":["(가), (나)","(나), (다)","(가), (다)","(다)"],"answer":1,"expl":"② (나), (다)\n* (가) 제1회 보험료는 청약철회 종료일 이전에 승낙한 경우 청약철회 종료일의 다음날에, 청약철회 종료일 이후에 승낙한 경우에는 승낙일에 투입한다."},{"id":3007,"s":4,"type":"mc","q":"다음 표에서 설명하는 금융투자업무는?","tb":["금전, 부동산 및 동산, 기타 재산권을 수탁받아 위탁자의 이익이나 특정목적을 위해 관리하는 업무 |"],"opts":["신탁업","투자매매업","집합투자업","투자자문업"],"answer":0,"expl":"① 신탁업에 대한 설명이다."},{"id":3008,"s":4,"type":"mc","q":"다음 중 변액연금보험의 상품안내에 대해 틀리게 설명한 것은?","opts":["(-) 수익률 가정에 의한 해약환급금도 함께 예시해야 한다.","가장 높은 투자수익률 가정은 평균공시이율 × 1.5배 이다.","투자수익률 예시에 사용되는 평균공시이율은 매년 동일하다.","최저연금적립금을 미보증하는 상품의 투자수익률 가정은 (-)평균공시이율을 포함하여 3개 이상이어야 한다."],"answer":2,"expl":"③ 투자수익률 예시에 사용되는 평균공시이율은 매년 재산정하므로 동일하지 않다."},{"id":3009,"s":4,"type":"mc","q":"다음 중 변액보험의 도입 배경(필요성)이 아닌 것은?","opts":["물가상승에 대응하는 보험금의 실질가치 보장","보험회사의 금리리스크 적정 관리","주식, 채권 등에 대한 투자 증가로 자본시장 발전 도모","정책당국의 보험가격 개입 증가"],"answer":3,"expl":"④ 정책당국의 보험가격 개입 증가는 도입배경이 아니다."},{"id":3010,"s":4,"type":"mc","q":"다음 표에서 A씨의 상속재산으로 보는 보험금은 얼마인가?","tb":["• 보험계약자 : A(본인) |","• 피보험자 : B(아버지) |","• 납입보험료 8천만원 중 2천만원은 A씨가, 6천만원은 B씨가 납입 |","• B씨의 사망으로 A씨가 사망보험금 1억원 수령 |"],"opts":["1억원","8천만원","4천만원","7천5백만원"],"answer":3,"expl":"④ 7천5백만원 (= 1억원 × 6/8)"},{"id":3011,"s":4,"type":"mc","q":"다음 표에서 설명하는 용어로 맞는 것은?","tb":["금리가 낮은 통화로 자금을 조달해 금리가 높은 나라의 금융상품 등에 투자함으로써 수익을 내는 거래 |"],"opts":["통화스왑","캐리 트레이드","선물거래","옵션거래"],"answer":1,"expl":"② 캐리 트레이드에 대한 설명이다."},{"id":3012,"s":4,"type":"mc","q":"다음 표의 ( ) 안에 들어갈 용어로 적절한 것은?","tb":["금융통화위원회의 기준금리 결정은 초단기금리인 ( )에 즉시 영향을 미치고, 장단기 시장금리, 예금 및 대출금리 등의 변동으로 궁극적으로는 실물경제 활동에 영향을 미치게 된다. |"],"opts":["채권수익률","콜금리","실질금리","표면금리"],"answer":1,"expl":"② 콜금리"},{"id":3013,"s":4,"type":"mc","q":"다음 중 변액보험에 관한 설명으로 틀린 것은?","opts":["특별계정 운용보수는 선택한 펀드에 따라 그 부과율이 다른 것이 일반적이다.","수익성을 추구하는 고객은 채권형 펀드 보다 주식형 펀드를 선택하는 것이 바람직하다.","특별계정 최초 설정 시 기준가격은 1,000좌당 1,000.00원으로 시작한다.","변액연금보험과 변액종신보험 모두 보험기간이 경과할수록 위험보험료가 증가하므로 펀드 투입금액이 줄어든다."],"answer":3,"expl":"④ 변액종신보험 보험기간이 경과할수록 위험보험료가 증가하므로 펀드 투입금액이 줄어들지만, 변액연금보험은 위험보험료가 차지하는 비중이 작고, 사업비 등의 상각이 10년 이내에 모두 되므로 오히려 보험기간이 경과할수록 펀드 투입금액은 증가한다.","tb":[]},{"id":3014,"s":4,"type":"mc","q":"다음 중 주식 및 채권에 대해 맞게 설명한 것은?","opts":["정부나 지방자치단체도 주식을 발행할 수 있다.","채권은 타인자본으로 재무제표상 부채계정으로 처리된다.","주주와 채권자는 회사경영상 동일한 지위를 갖는다.","기업의 청산시 주주는 채권자에 우선하여 변제받을 권리가 있다."],"answer":3,"expl":"① 정부나 지방자치단체도 채권을 발행할 수 있으며, 주식은 주식회사에서만 발행 가능하다.\n③ 주주는 회사경영상 의사결정권이 있지만, 채권자는 경영권이 없다.\n④ 기업의 청산시 채권자는 주주에 우선하여 변제받을 권리가 있다."},{"id":3015,"s":4,"type":"mc","q":"다음 표에서 종신형 연금보험계약의 보험차익 비과세 요건에 대해 틀리게 설명한 것을 모두 고른 것은?","tb":["(가) 연금 외의 형태로 보험금을 지급하지 않는 계약일 것 |","(나) 사망시 보험계약 및 연금재원이 소멸하지 않을 것 |","(다) 최초 연금지급개시 이후 사망일 전에 계약을 중도 해지 할 수 없을 것 |","(라) 만 60세 이후부터 사망시까지 보험금을 연금으로 지급받는 계약일 것 |"],"opts":["(가), (나)","(나), (라)","(가), (다)","(다), (라)"],"answer":1,"expl":"② (나), (라)\n* (나) 사망시 보험계약 및 연금재원이 모두 소멸할 것, (다) 60세 → 55세"},{"id":3016,"s":4,"type":"mc","q":"다음 중 금융소득 과세방법에 대해 틀리게 설명한 것은?","opts":["비과세 및 분리과세 소득까지 합산한 연간 금융소득이 2천만원을 초과하는 경우 금융소득 전체를 종합과세한다.","금융소득 종합과세 여부는 개인별 연간금융소득의 합계액으로 판단한다.","금융소득이 종합과세되는 경우, 다른 소득과 합산하여 소득세율을 적용한다.","비과세 및 분리과세 소득을 제외한 연간 금융소득이 2천만원인 경우 14%(지방소득세 별도)로 원천징수하여 납세의무가 종결된다."],"answer":0,"expl":"① 비과세 및 분리과세 소득까지 합산한 → 비과세 및 분리과세 소득을 제외한"},{"id":3017,"s":4,"type":"mc","q":"다음 변액보험 특별계정(펀드) 운용현황표에서 ( ) 안에 들어갈 누적수익률로 맞는 것은?","tb":["기준가격 | 전일대비 | 누적수익률 | 연환산수익률 |","1,600.00 | +3.0 | ( ) | 20.00% |"],"opts":["17.00%","160.00%","23.00%","60.00%"],"answer":3,"expl":"④ 60.00%"},{"id":3018,"s":4,"type":"mc","q":"다음 중 예금자보호제도에 대해 틀리게 설명한 것은?","opts":["예금보험료는 금융회사가 납부한다.","예금보험사고 발생시 예금보험금은 고객이 지급받는다.","변액보험은 「예금자보호법」에 따라 보호되는 부분이 없다.","법령상 보호금액의 한도가 설정되어 있다."],"answer":2,"expl":"③ 변액보험은 「예금자보호법」에 따라 특약과 최저보증보험금에 대해서는 보호를 받는다."},{"id":3019,"s":4,"type":"mc","q":"다음 표의 ( ) 안에 들어갈 용어로 맞는 것은?","tb":["금융거래비용 중 금융거래의사를 밝히고 거래상대방을 찾는데 드는 비용을 ( )이라 한다. |"],"opts":["정보비용","위험비용","탐색비용","의사비용"],"answer":2,"expl":"③ 탐색비용"},{"id":3020,"s":4,"type":"mc","q":"다음 중 변액보험의 변동보험계약에 대해 맞게 설명한 것은?","opts":["최저보증금액 산정의 기초가 된다.","투자손실이 발생할 경우 보험료를 추가납입해야 한다.","보험료 산출의 기초가 된다.","특별계정의 운용실적에 따라 추가로 계산된다."],"answer":0,"expl":"①, ③은 기본보험계약에 대한 설명이다.\n② 투자손실이 발생하더라도 추가보험료 부담이 없다.","tb":[]},{"id":3021,"s":4,"type":"mc","q":"다음 중 변액보험의 해약환급금에 대해 틀리게 설명한 것은?","opts":["중도해지시 해약환급금에서 보험계약대출금을 차감할 수 있다.","보험료 납입기간 중에는 해약환급금이 이미 납입한 보험료를 초과할 수 없다.","보험기간, 보험료 납입횟수 등에 따라 달라진다.","특별계정 적립금에서 해약공제금액을 차감하여 해약환급금으로 지급한다."],"answer":1,"expl":"② 투자실적이 좋은 경우 해약환급금이 이미 납입한 보험료를 초과할 수도 있다."},{"id":3022,"s":4,"type":"mc","q":"다음 중 변액보험의 보험료 납입에 대해 맞게 설명한 것은?","opts":["변액유니버셜보험은 의무납입기간 중 보험료를 추가 납입할 수 있다.","변액연금보험은 보험료 선납이 허용되지 않는다.","변액종신보험의 보험료 납입기간은 종신이며, 계약자가 임의로 선택할 수 없다.","변액종신보험의 보험료는 월납과 연납으로만 납입이 가능하다."],"answer":1,"expl":"② 변액연금보험은 보험료의 배수로 선납이 허용된다.\n③ 변액종신보험의 보험료 납입기간은 전기납, 단기납, 일시납 등으로 정할 수 있다.\n④ 변액종신보험의 보험료는 월납과 일시납으로만 납입이 가능하다."},{"id":3023,"s":4,"type":"mc","q":"다음 중 변액보험의 보험계약대출에 대해 맞게 설명한 것은?","opts":["보험계약자가 납입한 보험계약대출수수료는 특별계정(펀드)으로 투입되지 않는다.","대출상환금액은 상환일에 즉시 특별계정(펀드)으로 투입된다.","보험계약대출금은 월계약해당일에 상환해야 한다.","보험계약대출시 별도의 이자가 부과되지 않는다."],"answer":1,"expl":"② 대출상환금액은 상환일+제2영업일에 즉시 특별계정(펀드)으로 투입된다.\n③ 보험계약대출금은 언제든지 상환할 수 있다.\n④ 보험계약대출시 별도의 이자가 부과된다."},{"id":3024,"s":4,"type":"mc","q":"다음 표에서 A씨의 상속세 산출세액(지방소득세 별도)은 얼마인가?","tb":["A씨의 상속세 과세표준 : 5억원 |"],"opts":["5천만원","9천만원","1억원","1억5천만원"],"answer":1,"expl":"② 9천만원 (= 1억원 × 10% + 4억원 × 20%)\n* 과세표준 1억원 이하 10%, 1억원 초과 5억원 이하 20% 적용)"},{"id":3025,"s":4,"type":"mc","q":"다음 중 변액보험의 현금흐름에 대해 맞게 설명한 것은?","opts":["계약관리비용 중 계약유지비용은 보험료를 납입하는 기간 이내에만 사용하는 사업비이다.","납입 중 계약유지비용은 적립하다가 보험료 납입이 완료되면 그 때부터 준비금에서 차감하여 사용하게 된다.","특별계정 투입보험료는 순보험료에 납입 중 계약유지비용을 합한 금액이다.","변액종신보험에서는 연령이 증가함에 따라 특별계정(펀드)으로 투입되는 금액이 작아진다."],"answer":0,"expl":"① 계약유지비용은 보험료를 납입하는 기간뿐만 아니라 그 이후에도 발생한다.\n② 납입 중 계약유지비용 → 납입 후 계약유지비용\n③ 납입 중 계약유지비용 → 납입 후 계약유지비용","tb":[]},{"id":3026,"s":4,"type":"mc","q":"다음 중 변액유니버셜보험에 대해 틀리게 설명한 것은?","opts":["변액유니버셜보험(보장형)에서 초과적립금이 발생할 경우 변동보험금을 추가로 가입하여 보장수준을 높일 수 있다.","현재 판매 중인 변액유니버셜보험(보장형)은 기본보험금만 있는 형태가 대부분이다.","변액유니버셜보험(적립형)은 기본사망보험금을 사망보험금으로 최저보증한다.","변액유니버셜보험(적립형)의 사망보험금은 매일 변동한다."],"answer":2,"expl":"③ 변액유니버설보험(적립형)은 이미 납입한 보험료를 사망보험금으로 최저보증한다."},{"id":3027,"s":4,"type":"mc","q":"다음 중 변액종신보험과 일반종신보험의 공통점이 아닌 것은?","opts":["다양한 선택특약을 자유롭게 조립할 수 있다.","투자실적에 따라 사망보험금이 변동한다.","우량체할인 특약을 통해 보험료 할인혜택을 받을 수 있다.","보장성보험료 세액공제혜택을 받을 수 있다."],"answer":1,"expl":"② 사망보험금이 변동하는 것은 변액종신보험이며, 일반종신보험은 사망보험금이 고정되어 있다.","tb":[]},{"id":3028,"s":4,"type":"mc","q":"다음 표에서 설명하는 용어로 맞는 것은?","tb":["이미 비용이 지불하고 계획이 실행된 후에는 어떤 선택을 하더라도 회수할 수 없는 비용 |"],"opts":["고정비용","매몰비용","기회비용","선급비용"],"answer":1,"expl":"② 매몰비용에 대한 설명이다."},{"id":3029,"s":4,"type":"mc","q":"다음 중 수지상등의 원칙에 대해 틀리게 설명한 것은?","opts":["보험계약자 개개인으로 본다고 해도 수지상등의 원칙은 항상 적용된다.","보험회사의 수입보험료 총액과 지급보험금, 사업비 등의 지출총액이 균형을 이루는 것을 말한다.","보험계약자로서는 납입보험료와 보험금 사이에 차이가 날 수도 있다.","보험회사가 경영을 지속적으로 유지하기 위해 필요한 조건이다."],"answer":0,"expl":"① 보험계약자 개개인으로 본다고 해도 수지상등의 원칙은 일반적으로 적용되지 않지만, 보험회사 입장에서는 수지상등의 원칙은 항상 적용된다."},{"id":3030,"s":4,"type":"mc","q":"다음 중 변액보험 판매 시 준수사항에 대해 틀리게 설명한 것은?","opts":["모집종사자는 적합성 진단결과 보험계약자에게 적합하지 아니하다고 인정되는 보험계약의 체결을 권유해서는 안된다.","변액보험 판매시 보험계약자에게 변액보험 주요내용 확인서를 교부하여야 한다.","변액보험을 판매하는 설계사는 매년 2시간 보수교육을 이수하여야 한다.","보험회사 및 모집종사자는 관계법규에 따라 적합성 진단과 관련하여 보험계약자로부터 확인받은 내용을 10년(보장기간이 10년을 초과하는 경우는 보장기간) 동안 유지·관리하여야 한다."],"answer":2,"expl":"③ 변액보험을 판매하는 설계사는 매년 4시간 보수교육을 이수하여야 한다."},{"id":3031,"s":4,"type":"mc","q":"다음 중 변액보험의 공시에 대해 맞게 설명한 것은?","opts":["저축성 변액보험의 수수료 안내표는 보험가입 전에만 확인이 가능하다.","생명보험회사 인터넷 홈페이지를 통해 타사 펀드수익률과 최근 기준가격 변동을 비교해 볼 수 있다.","보험회사는 반기별 1회 이상 보험계약자에게 보험계약관리내용을 제공하여야 한다.","매일의 변액보험 펀드별 기준가격 및 수익률을 생명보험협회 공시실에서 확인할 수 있다."],"answer":0,"expl":"① 수수료 안내표는 보험가입 전과 가입 후 보험회사 및 보험협회에서 확인할 수 있다.\n② 생명보험회사는 타사 펀드수익률과 최근 기준가격 변동을 비교하여 공시할 수 없다.\n③ 반기별 1회 → 분기별 1회"},{"id":3032,"s":4,"type":"mc","q":"다음 표의 경우 변액보험의 계약자가 보유하게 되는 계약자 보유좌수는?","tb":["• 납입보험료 중 특별계정(펀드) 투입보험료 : 2천만원","• 특별계정(펀드) 투입일의 펀드 기준가격 : 2,000원"],"opts":["100만좌","200만좌","1,000만좌","2,000만좌"],"answer":2,"expl":"③ 1,000만좌 ( = 2천만원 / 2,000원 × 1,000)"},{"id":3033,"s":4,"type":"mc","q":"다음 중 변액보험의 계약내용에서 변경할 수 없는 것은?","opts":["보험계약 체결시 선택한 펀드","보험가입금액의 감액","변액유니버설보험의 보험기간","변액보험 자산운용옵션"],"answer":2,"expl":"③ 변액유니버설보험의 보험기간은 변경할 수 없다."},{"id":3034,"s":4,"type":"mc","q":"다음 중 채권투자자에 대해 맞게 설명한 것을 모두 고른 것은?","tb":["(가) 개인의 채권투자는 증권회사가 보유하고 있는 채권을 환매조건부채권(RP) 방식으로 거래하는 것이 보통이다.","(나) 일반적으로 주식보다 수익성이 좋고 예금에 비해 안정성이 높다.","(다) 주식의 3일 결제와 달리 익일 또는 당일결제가 가능하다."],"opts":["(가)","(가), (나)","(가), (다)","(나), (다)"],"answer":2,"expl":"③ (가), (다)\n* (나) 일반적으로 주식보다는 수익성이 낮고(안정성이 높고), 예금에 비해서는 수익성이 높다."},{"id":3035,"s":4,"type":"mc","q":"다음 중 변액보험 보증옵션에 대해 맞게 설명한 것은?","opts":["최저중도인출금보증(GMWB)은 변액유니버설보험에만 적용되는 옵션이다.","최저연금보증(GMIB)은 이미 납입한 보험료 등 약정된 보증금액을 연금개시시점의 계약자적립금(연금재원)으로 보증하는 옵션이다.","최저연금적립금보증(GMAB)은 연금개시후 보험기간 중 연금재원을 특별계정에서 운용할 경우 특별계정의 투자성과에 관계없이 연금재원의 일정 수준을 인출할 수 있도록 보증하는 옵션이다.","최저사망보험금보증(GMDB)은 변액종신보험, 변액연금보험 및 변액유니버설보험에 모두 적용될 수 있다."],"answer":0,"expl":"① 최저중도인출금보증(GMWB)은 변액연금보험에만 적용되는 옵션이다.\n② 이미 납입한 보험료 등으로 연금개시시점의 계약자적립금(연금재원)으로 보증하는 옵션은 GMAB이다.\n③ 연금개시후 보험기간 중 연금재원을 특별계정에서 운용할 경우 특별계정의 투자성과에 관계없이 연금재원의 일정 수준을 인출할 수 있도록 보증하는 옵션은 GMWB이다.","tb":[]},{"id":3036,"s":4,"type":"mc","q":"다음 중 보험회사의 일반계정과 특별계정(변액보험)을 비교한 내용으로 맞는 것은?","tb":["구분 | 일반계정 | 특별계정 |","(가) | 리스크부담 | 계약자 | 보험회사 |","(나) | 자산평가시기 | 매일 | 매년 |","(다) | 결산시기 | 매년 | 매일 |","(라) | 자산운용목적 | 수익성위주 | 안정성위주 |"],"opts":["(가)","(나)","(다)","(라)"],"answer":2,"expl":"③ (다)\n* 특별계정은 계약자가 리스크를 부담하고, 자산평가는 매일, 운용목적은 수익성에 있다."},{"id":3037,"s":4,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)을 주식형, 채권형, 혼합형 펀드 등으로 구분하는 기준은?","opts":["채권의 편입비율","주식의 편입비율","펀드 운용회사의 과거수익률","펀드 자산운용의 위탁여부"],"answer":1,"expl":"② 주식의 편입비율","tb":[]},{"id":3038,"s":4,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 자산운용옵션에 대해 틀리게 설명한 것은?","opts":["보험계약자는 펀드 자동재배분 기능의 적용여부를 선택할 수 있다.","펀드변경을 통해 보험회사는 보험계약자에게 자산운용에 대한 간접선택권을 부여한다.","보험료 분산투입기능을 이용해 보험계약자는 리스크의 분산을 도모할 수 있다.","일시납 보험료는 그 자체로 이미 평균분할 투자가 적용되어 있어 평균분할투자 기능이 불필요하다."],"answer":3,"expl":"④ 일시납 보험료 → 월납 보험료","tb":[]},{"id":3039,"s":4,"type":"mc","q":"다음 중 주가수익비율(PER)에 대해 틀리게 설명한 것은?","opts":["채권금리의 역수와 유사하다.","주가가 1만원이고 주당 순이익이 1천원이면 PER은 10배가 된다.","주식의 현금창출능력과 현재가격을 비교하는 잣대이다.","PER이 낮은 주식은 앞으로 주식가격이 하락할 가능성이 크다."],"answer":3,"expl":"④ PER이 낮은 주식은 앞으로 주식가격이 상승할 가능성이 크다."},{"id":3040,"s":4,"type":"mc","q":"다음 중 주식의 매매거래에 대한 설명으로 틀린 것은?","opts":["현행 한국거래소 정규시장의 매매거래시간은 9시~15시 30분(6시간 30분)이다.","코스닥시장에서 호가단위는 가격대별로 1원에서 1천원까지 7단계로 구분된다.","투자자들에게 추가로 매매기회를 부여하기 위한 시간외 시장은 개장전 8시~9시(1시간), 폐장 후 15시 40분~18시(3시간 20분)로 운영되고 있다.","주식의 매매거래는 매매계약을 체결한 날로부터 3일째 되는 날(휴장일 제외)에 결제가 이루어지는 보통결제거래에 따른다."],"answer":1,"expl":"② 유가증권시장은 7단계, 코스닥시장은 5단계로 호가단위가 적용된다."}];

{"id":4005,"s":5,"type":"mc","q":"다음 중 변액보험의 공시에 대해 틀리게 설명한 것은?","opts":["특별계정(펀드)의 기준가격, 수익률 및 보수정보 등을 생명보험협회 공시실에 매월 말 1회 공시한다.","변액보험은 일반보험보다 강화된 공시기준이 적용된다.","보험회사는 인터넷 홈페이지에 특별계정 운용현황 및 변액보험 운용설명서 등을 공시해야 한다.","변액보험의 계약관리내용은 분기별 1회 이상 통보해야 한다."],"answer":0,"expl":"① 매월 말 1회 → 매일 공시이다."},
{"id":4006,"s":5,"type":"mc","q":"다음 중 변액보험의 자산 평가방법에 대해 틀리게 설명한 것은?","opts":["좌당 기준가격방법을 사용하여 특별계정(펀드) 적립금을 산출한다.","당일의 기준가격은 전일말 특별계정(펀드)의 전체 순자산가치를 특별계정(펀드) 총좌수로 나누어 산출한다.","매월 동일한 금액이 특별계정(펀드)으로 투입되면 증가하는 보유좌수도 동일하다.","특별계정(펀드)의 자산운용 실적이 호전되면 기준가격이 상승한다."],"answer":2,"expl":"③ 투입일 기준가격에 따라 취득 좌수는 달라질 수 있다."},
{"id":4007,"s":5,"type":"mc","q":"다음 표의 ( ) 안에 들어갈 용어로 맞는 것은?","tb":["변액보험 특별계정(펀드)의 원활한 운영을 위하여 최초 개설시 보험회사 자산의 일부를 펀드에 투입하여 초기 펀드의 자산이 일정 규모 이상을 유지하도록 ( )을/를 설정할 수 있다."],"opts":["책임준비금","월대체보험료","초기투자자금","미상각신계약비"],"answer":2,"expl":"③ 초기투자자금에 대한 설명이다."},
{"id":4008,"s":5,"type":"mc","q":"다음 중 변액종신보험에 대해 틀리게 설명한 것은?","opts":["특별계정(펀드)의 운용실적에 따라 해약환급금이 매일 변동한다.","기본보험금 이상의 사망보험금이 지급된다.","투자수익률에 따라 (-) 변동보험금이 발생할 수 있다.","보험료 납입기간은 종신이며, 단기납으로 설정할 수 없다."],"answer":3,"expl":"④ 보험료 납입기간은 종신이며, 전기납·단기납·일시납 등으로 설정할 수 있다."},
{"id":4009,"s":5,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 채권형 펀드에 대해 틀리게 설명한 것은?","opts":["채권 및 유동성 자산에 투자하여 안정적인 수익 획득을 목적으로 한다.","전환사채 등 주식관련 합성채권에 투자할 수 있다.","주식에 최대 30%까지 투자할 수 있다.","투자원본에 대한 손실위험이 존재한다."],"answer":2,"expl":"③ 채권형 펀드는 주식에 투자할 수 없다."},
{"id":4010,"s":5,"type":"mc","q":"다음 중 금융소득의 과세방법에 대해 맞게 설명한 것은?","opts":["금융소득에 이자는 포함되지만, 배당은 포함되지 않는다.","금융소득 종합과세가 적용되는 기준금액은 부부의 소득을 합산하여 계산한다.","금융소득이 1천만원인 경우 종합과세한다.","금융소득이 종합과세 되는 경우, 다른 소득과 합산하여 소득세율을 적용한다."],"answer":3,"expl":"① 이자와 배당을 총칭하는 소득이다 · ② 개인 기준(부부합산 아님) · ③ 1천만원은 분리과세로 과세 종결."},
{"id":4011,"s":5,"type":"mc","q":"다음 중 장기금융상품에 대해 틀리게 설명한 것은?","opts":["대규모 거래가 이루어지기 때문에 단기금융상품에 비해 유동성이 비교적 높다.","만기가 길어 금리변동에 따른 가격변동위험이 크다.","신용도가 낮은 기업도 채권을 발행하기 때문에 채무불이행 위험이 따른다.","투자위험 회피를 위해 파생금융상품에 대한 투자가 병행된다."],"answer":0,"expl":"① 대규모 거래 및 높은 유동성은 단기금융상품의 특징이다."},
{"id":4012,"s":5,"type":"mc","q":"다음 중 종신형 연금보험의 보험차익 비과세 요건에 대해 맞게 설명한 것은?","opts":["50세 이후부터 사망시까지 연금으로 수령할 것","납입할 보험료의 합계액이 1억원 이하일 것","보험료 납입기간이 3년 이상일 것","연금 외의 형태로 보험금을 지급하지 아니할 것"],"answer":3,"expl":"① 55세 이후부터 사망시까지 · ② 1억원 이하는 일시납보험 요건 · ③ 종신형은 납입기간·납입보험료 제한이 없다."},
{"id":4013,"s":5,"type":"mc","q":"다음 표에서 가입 후 20년이 된 때에 피보험자가 사망한 경우 수익자에게 지급되는 금액으로 맞는 것은?","tb":["상품: 변액유니버설보험(적립형) · 가입조건: 남자 40세, 기본보험료 50만원(전기납) · 기본사망보험금 500만원","20년차: 납입보험료 12,000만원 · 특별계정 투입보험료 11,096만원 · 기본보험금+계약자적립금 9,738만원"],"opts":["12,000만원","11,096만원","9,738만원","500만원"],"answer":0,"expl":"① MAX(기본보험금+계약자적립금 9,738만원, 이미 납입한 보험료 12,000만원) = 12,000만원."},
{"id":4014,"s":5,"type":"mc","q":"다음 그림과 같이 변동보험금을 계산하는 변액보험상품으로 맞게 짝지어진 것은?","tb":["(그림) 가입 이후 종신까지 기본보험계약에 대한 예정적립금과 계약자적립금, 최저사망보험금과 실제사망보험금의 관계를 나타낸 그래프"],"opts":["변액연금보험, 변액유니버설보험(보장형)","변액연금보험, 변액유니버설보험(적립형)","변액종신보험, 변액유니버설보험(보장형)","변액종신보험, 변액유니버설보험(적립형)"],"answer":2,"expl":"③ 일시납보험 추가가입방법은 변액종신보험, 변액유니버설보험(보장형)에 적용된다."},
{"id":4015,"s":5,"type":"mc","q":"다음 표의 ( ) 안에 들어갈 세율(지방소득세 별도)을 순서대로 맞게 나열한 것은?","tb":["종합소득 과세표준이 1,400만원 이하인 경우: (가)","상속세 과세표준이 1억원 이하인 경우: (나)"],"opts":["(가) 6% (나) 10%","(가) 14% (나) 10%","(가) 10% (나) 6%","(가) 6% (나) 6%"],"answer":0,"expl":"① (가) 6% (나) 10%"},
{"id":4016,"s":5,"type":"mc","q":"다음 중 우리나라의 변액보험과 관련한 법적 규제에 대해 틀리게 설명한 것은?","opts":["변액보험 특별계정 펀드는 「자본시장법」상 집합투자기구 요건을 준수해야 한다.","변액보험 판매자격제도의 도입 근거는 「자본시장법」에 있다.","손해보험회사는 변액보험을 판매할 수 없다.","회계처리나 자산운용방법 등이 일반보험과 상이하여 별도의 규제가 적용된다."],"answer":1,"expl":"② 도입 근거는 「보험업법 시행령」과 「보험업감독규정」에 있다."},
{"id":4017,"s":5,"type":"mc","q":"다음 중 아래 변액연금보험의 투자수익률 예시표에 대해 맞게 설명한 것은?","tb":["투자수익률 -1% 가정(순수익률 -1.2%) · 가입자: 남 30세, 60세 연금개시 · 10년 월납 월보험료 50만원 · 최저연금적립금 보증 선택(연금지급시점 이미 납입한 보험료 최저보증)","1년: 사망보험금 851 · 해약환급률 43.6% / 5년: 2,968 · 83.4% / 10년: 5,517 · 83.8% / 20년: 4,921 · 80.0% / 30년: 4,419 · 71.2%"],"opts":["기간경과에 따라 해약환급률도 계속 증가하였다.","연금개시시점의 연금재원은 6,000만원이다.","20년 경과시점의 사망보험금과 계약자적립금은 동일하다.","20년 경과시점에 계약해지시 해약환급금은 6,000만원으로 보증된다."],"answer":1,"expl":"② 연금개시시점 연금재원은 최저보증(이미 납입한 보험료 6,000만원) 적용 금액. ① 환급률은 증가 후 다시 감소 · ③ 20년 시점 사망보험금 4,921만원은 계약자적립금과 동일하지 않다 · ④ 해약환급금은 최저보증되지 않는다."},
{"id":4018,"s":5,"type":"mc","q":"다음 중 변액보험 판매시 금지사항이 아닌 것은?","opts":["장래 투자수익률을 가정하여 해약환급금을 예시하는 행위","손실에 대한 보상을 약속하는 행위","타 금융상품이나 일반 보험상품으로 오인하게 하는 행위","자사에게 유리하게 특정회사 또는 특정기간만 비교하는 행위"],"answer":0,"expl":"① 장래 투자수익률(3가지)을 가정하여 해약환급금을 예시하는 행위는 가능하다."},
{"id":4019,"s":5,"type":"mc","q":"다음 중 전환사채와 교환사채의 공통점에 해당하지 않는 것은?","opts":["권리행사시 사채권자의 지위를 상실한다.","권리행사시 유가증권을 취득할 수 있다.","일반사채에 별도의 권리가 부여된 합성채권에 해당한다.","권리행사시 채권발행회사의 자본금이 증가한다."],"answer":3,"expl":"④ 자본금이 증가하는 것은 전환사채이며, 교환사채는 자본금이 증가하지 않는다."},
{"id":4020,"s":5,"type":"mc","q":"다음 중 변액보험과 투자신탁(수익증권)의 공통점으로 맞는 것은?","opts":["최저사망보험금 보증을 적용한다.","선택특약을 활용한다.","사망보장을 위해 위험보험료를 부담한다.","유가증권 등에 투자하여 투자수익을 적립한다."],"answer":3,"expl":"④ ①②③은 변액보험의 특징이며 투자신탁에는 적용되지 않는다."},
{"id":4021,"s":5,"type":"mc","q":"다음 중 보험회사가 계약자의 계약 전 알릴의무 위반으로 계약을 해지할 수 있는 경우에 해당하는 것은?","opts":["보험설계사 등이 피보험자에게 사실대로 고지할 기회를 주지 않은 경우","청약 시 피보험자의 건강상태를 판단할 수 있는 기초자료에 따라 승낙한 후 기초자료에 명기되어 있는 사항으로 보험금 지급사유가 발생하였을 때","보험회사가 계약당시 계약 전 알릴의무 위반 사실을 과실로 인하여 알지 못한 경우","보험회사가 계약 전 알릴의무 위반 사실을 안 날로부터 1개월이 지나지 않은 경우"],"answer":3,"expl":"④ 위반 사실을 안 날로부터 1개월이 지나지 않은 경우에 해지할 수 있다."},
{"id":4022,"s":5,"type":"mc","q":"다음 중 금리에 대해 맞게 설명한 것은?","opts":["표면금리가 동일한 예금은 실효금리도 항상 동일하다.","일반적으로 금리가 오르면 기업의 투자는 확대된다.","한국은행은 주로 통화안정증권 금리를 기준금리로 이용한다.","실질금리는 명목금리에서 예상 인플레이션율(물가상승률)을 차감하여 계산한다."],"answer":3,"expl":"④ 실질금리 = 명목금리 − 예상물가상승률. ① 단리·복리 등으로 실효금리는 상이 · ② 투자는 위축 · ③ 기준금리는 경제·물가 등을 종합적으로 고려하여 결정."},
{"id":4023,"s":5,"type":"mc","q":"다음 중 변액보험 특별계정(펀드)의 자산운용옵션에 해당하지 않는 것은 무엇인가?","opts":["보험료 자동이체 기능","펀드변경 기능","보험료 평균분할투자 기능","펀드 자동재배분 기능"],"answer":0,"expl":"① 보험료 자동이체는 자산운용옵션이 아니다."},
{"id":4024,"s":5,"type":"mc","q":"다음 중 변액보험의 보험계약대출에 대해 틀리게 설명한 것은?","opts":["보험계약대출 원리금은 매월 계약해당일에 상환해야 한다.","해약환급금의 일정범위 이내에서 보험계약대출을 받을 수 있다.","상환금액은 「상환일+제2영업일」에 일반계정에서 특별계정(펀드)으로 투입된다.","대출금 등을 상환하지 않은 경우, 보험금 지급시 보험계약대출 원리금을 차감할 수 있다."],"answer":0,"expl":"① 보험계약대출 원리금은 언제든지 상환할 수 있다."},
{"id":4025,"s":5,"type":"mc","q":"다음 표에서 해당 변액보험 특별계정(펀드) 설정 후 3년이 경과한 시점의 연환산수익률로 맞는 것은?","tb":["변액보험 특별계정(펀드) 수익률 — 1년차 누적수익률 5% · 2년차 누적수익률 3% · 3년차 누적수익률 18%"],"opts":["3%","5%","6%","18%"],"answer":2,"expl":"③ 연환산수익률 = 3년차 누적 18% ÷ 3년 = 6%."},
{"id":4026,"s":5,"type":"mc","q":"다음 중 변액유니버설보험의 보험료 납입에 대해 틀리게 설명한 것은?","opts":["기본적으로 보험기간과 보험료 납입기간은 종신이다.","의무납입기간 이내에는 보험료를 추가납입할 수 없다.","의무납입기간 이후에는 보험료 납입의 자율성을 가진다.","보험료를 추가납입하면 계약자 보유좌수 및 적립금이 동시에 증가한다."],"answer":1,"expl":"② 의무납입기간 이내에도 보험료를 추가납입할 수 있다(추가납입은 보험기간 중 언제든지 가능, 선납은 의무납입기간에 한해 가능)."},
{"id":4027,"s":5,"type":"mc","q":"다음 중 주식 투자수익에 대한 과세에 대해 틀리게 설명한 것은?(대주주의 주식거래가 아님)","opts":["주식의 매매차익에 대해서는 종합소득세로 과세한다.","유가증권시장에서 양도되는 주권에 대해서는 매도금액에 대해서 증권거래세를 원천징수한다.","주식 매매시에 발생하는 위탁수수료율은 금융투자회사별로 자율로 책정하고 있다.","배당금에 대해서는 15.4%(지방소득세 포함)의 세금이 원천징수된다."],"answer":0,"expl":"① 주식의 매매차익에 대해서는 과세하지 않는다."},
{"id":4028,"s":5,"type":"mc","q":"다음 표에서 설명하는 단기금융시장은 무엇인가?","tb":["일정기간 경과 후에 일정한 가격으로 동일 채권을 다시 매수하거나 매도할 것을 조건으로 상품거래가 이루어지는 금융시장"],"opts":["자산유동화증권시장","양도성예금증서시장","환매조건부채권시장","통화안정증권시장"],"answer":2,"expl":"③ 환매조건부채권시장(RP)에 대한 설명이다."},
{"id":4029,"s":5,"type":"mc","q":"다음 중 우선주에 대해 틀리게 설명한 것은?","opts":["이익배당이나 잔여재산분배 등에서 표준이 되는 주식","참가적 우선주와 비참가적 우선주로 구분","누적적 우선주와 비누적적 우선주로 구분","후배주와 반대되는 개념의 주식"],"answer":0,"expl":"① 이익배당이나 잔여재산분배 등에서 표준이 되는 주식은 보통주이다."},
{"id":4030,"s":5,"type":"mc","q":"다음 중 변액보험의 해지 및 부활에 대해 틀리게 설명한 것은?","opts":["계약부활시 적립금은 해지된 시점의 적립금을 기준으로 산출한다.","계약이 부활되어도 해지된 기간 동안의 특별계정(펀드) 운용실적을 확보할 수 없다.","해약환급금에서 최저보증비용을 충당할 수 없는 경우 납입최고기간 없이 즉시 해지된다.","해약환급금은 피보험자의 나이, 보험료납입횟수 등에 따라 달라진다."],"answer":2,"expl":"③ 최저보증비용을 충당할 수 없는 경우 일반보험과 동일하게 납입최고 절차를 거친 후 해지된다."},
{"id":4031,"s":5,"type":"mc","q":"다음 중 변액보험의 최저보증옵션에 대해 맞게 설명한 것은?","opts":["변액종신보험의 최저보증옵션 설정여부는 계약자가 선택할 수 있다.","최저보증을 위해서 적립금에서 특별계정 보증비용을 차감하여 보증준비금 항목으로 적립한다.","보증비용은 모든 회사가 동일한 수준을 적용하고 있다.","변액연금보험에서 최저사망보험금보증은 적용되지 않는다."],"answer":1,"expl":"② 보증준비금으로 적립한다. ① 설정여부는 계약자가 선택할 수 없다 · ③ 보증비용은 회사마다 다르다 · ④ 변액연금보험에도 최저사망보험금보증이 적용된다."},
{"id":4032,"s":5,"type":"mc","q":"다음 표에서 설명하는 용어로 맞는 것은?","tb":["공·사채와 은행융자 등에 대한 이자 지불이나 원리금 상환이 불가능해진 상태"],"opts":["인플레이션","디폴트","모라토리엄","엠바고"],"answer":1,"expl":"② 디폴트에 대한 설명이다."},
{"id":4033,"s":5,"type":"mc","q":"다음 중 부가보험료에 대하여 맞게 설명한 것은?","opts":["예정위험률을 기초로 산출된 보험료를 말한다.","예정사업비율에 의해 산출된 보험료를 말한다.","위험보험료와 저축보험료를 합하여 계산한다.","만기보험금과 같이 생존시 지급되는 보험금의 재원이다."],"answer":1,"expl":"② 예정사업비율에 의해 산출된 보험료가 부가보험료이다. ① 위험보험료 · ③ 순보험료(위험+저축) · ④ 저축보험료에 대한 설명이다."},
{"id":4034,"s":5,"type":"mc","q":"다음 표의 사망보험금 과세방법에 대해 맞게 나열한 것은?","tb":["(가) 계약자 본인 · 피보험자 모 · 수익자 본인 · 보험료 실질납입자 본인 · 사망자 모","(나) 계약자 부 · 피보험자 부 · 수익자 본인 · 보험료 실질납입자 부 · 사망자 부"],"opts":["(가) 상속세 과세 (나) 상속세 과세","(가) 상속세 과세 (나) 과세안됨","(가) 과세안됨 (나) 과세안됨","(가) 과세안됨 (나) 상속세 과세"],"answer":3,"expl":"④ (가) 과세안됨 · (나) 상속세 과세"},
{"id":4035,"s":5,"type":"mc","q":"다음 중 변액보험 자산운용에 대해 맞게 설명한 것은?","opts":["자산평가방법 기본원칙 : 원가평가","자산운용실적 적립금 반영방법 : 좌당기준가격 방법","특별계정(펀드)과 일반계정 자산의 상호교환 : 가능","특별계정(펀드)의 개별 주식종목에 대한 계약자의 운용지시 : 가능"],"answer":1,"expl":"② 좌당기준가격 방법. ① 시가평가 · ③ 상호교환 불가능 · ④ 계약자의 운용지시 불가능."},
{"id":4036,"s":5,"type":"mc","q":"다음 표의 ( ) 안에 들어갈 용어를 순서대로 맞게 나열한 것은?","tb":["특별계정 투입보험료 = 납입보험료 − (계약체결비용 + (가) + 기타비용) = 순보험료 + (나)"],"opts":["(가) 납입 중 계약유지비용, (나) 납입 후 계약유지비용","(가) 특별계정 운용보수, (나) 납입 후 계약유지비용","(가) 납입 중 계약유지비용, (나) 특별계정 운용보수","(가) 위험보험료, (나) 납입 후 계약유지비용"],"answer":0,"expl":"① (가) 납입 중 계약유지비용, (나) 납입 후 계약유지비용"},
{"id":4037,"s":5,"type":"mc","q":"다음 중 생명보험협회 홈페이지에서 제공하는 변액보험 공시항목에 해당하는 것은?","opts":["변액보험 가입설계서","변액보험 주요내용 확인서","계약자별 보험계약관리내용","변액보험 특별계정(펀드) 기준가격"],"answer":3,"expl":"④ 특별계정(펀드) 기준가격은 협회 공시실에서 공시한다. ①②③은 공시항목이 아니다."},
{"id":4038,"s":5,"type":"mc","q":"다음 표에서 설명하는 용어는 무엇인가?","tb":["곡물가격이 상승하는 영향으로 일반 물가가 오르는 현상"],"opts":["디플레이션","리플레이션","애그플레이션","스테그플레이션"],"answer":2,"expl":"③ 애그플레이션에 대한 설명이다."},
{"id":4039,"s":5,"type":"mc","q":"다음 중 「예금자보호법」상 보호대상이 아닌 금융기관은?","opts":["손해보험회사","투자중개업자","농협 지역조합","상호저축은행"],"answer":2,"expl":"③ 농협 지역조합은 비보호 금융회사이다."},
{"id":4040,"s":5,"type":"mc","q":"다음 중 변액보험 보험료의 특별계정 투입과 관련하여 맞게 설명한 것은?","opts":["보험료 납입기간 중에는 계약자가 납입한 보험료 전액을 특별계정에 투입한다.","보험료 납입기간 이후에는 월계약해당일에 자연식 위험보험료와 납입 후 계약유지비용을 특별계정 적립금에서 일반계정으로 차감한다.","계약자가 납입한 제1회 보험료는 즉시 특별계정으로 투입한다.","청약을 한 날부터 30일 이내에 승낙된 경우에는 청약을 한 날부터 30일이 지난 날을 이체사유가 발생한 날로 한다."],"answer":1,"expl":"② 납입 후에는 월 계약해당일에 자연식 위험보험료·납입 후 계약유지비용을 차감한다. ① 일부만 투입 · ③ 제1회 보험료는 즉시 투입되지 않는다 · ④ 30일이 지난 날의 다음날이 이체사유 발생일."}
