<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>변액보험 판매관리사 · 제1회 실전모의고사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface2:#ECF2EE;
  --ink:#17241F; --muted:#63756E; --line:#E0E8E2;
  --primary:#0C6B57; --primary-soft:#E0F0E9; --primary-ink:#F2FAF7;
  --wrong:#C43D22; --wrong-soft:#FBEDE7; --star:#DE9500;
  --shadow:0 1px 2px rgba(23,36,31,.05),0 8px 24px rgba(23,36,31,.06);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0D1916; --surface:#152420; --surface2:#1C2E28;
  --ink:#E6EFEA; --muted:#93A69E; --line:#273B34;
  --primary:#45C39F; --primary-soft:rgba(69,195,159,.13); --primary-ink:#06231C;
  --wrong:#E9755A; --wrong-soft:rgba(233,117,90,.15); --star:#F2B93B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#wrap{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
#top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:var(--primary);color:var(--primary-ink);
  display:grid;place-items:center;font-weight:800;font-size:17px}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand p{font-size:11.5px;color:var(--muted);margin-top:1px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);
  border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{color:var(--ink)}
.icn{width:20px;height:20px;display:block}
.icn svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{flex:1;padding:18px 16px 104px}

/* ---- tab bar ---- */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar .in{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;
  font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.tab .icn{width:21px;height:21px}
.tab.on{color:var(--primary)}
.tab.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}
.tab .dot{position:absolute;top:7px;margin-left:26px;min-width:16px;height:16px;border-radius:8px;background:var(--wrong);
  color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ---- common ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:18px}
.sec-title{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;border-radius:12px;
  padding:12px 18px;font-size:14.5px;border:1px solid var(--line);background:var(--surface);transition:filter .15s, transform .05s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--wrong);border-color:color-mix(in srgb,var(--wrong) 35%,var(--line))}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip.warn{color:var(--star);border-color:color-mix(in srgb,var(--star) 40%,var(--line));background:color-mix(in srgb,var(--star) 8%,var(--surface))}
.chip.row{display:flex;overflow-x:auto;gap:7px;padding:2px 0 4px;scrollbar-width:none}
.chip.row::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2.5px 8px;border-radius:999px}
.badge.ok{background:var(--primary-soft);color:var(--primary)}
.badge.no{background:var(--wrong-soft);color:var(--wrong)}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---- home ---- */
.hero{padding:22px 20px;background:linear-gradient(135deg,var(--primary) 0%,color-mix(in srgb,var(--primary) 78%,#06342B) 100%);
  color:var(--primary-ink);border:0}
.hero .eyebrow{font-size:12px;font-weight:700;opacity:.75;letter-spacing:.06em}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:5px 0 3px}
.hero .meta{font-size:13px;opacity:.85;font-weight:500}
.hero .go{margin-top:16px;width:100%;padding:14px;border-radius:13px;background:var(--primary-ink);color:var(--primary);
  font-weight:800;font-size:15.5px;border:0;display:flex;align-items:center;justify-content:center;gap:8px}
.hero .go:hover{filter:brightness(1.03)}
.resume{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;margin-bottom:14px;
  background:color-mix(in srgb,var(--star) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--star) 35%,var(--line));
  font-size:13.5px;font-weight:600}
.resume .btn{margin-left:auto;flex:none}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qact{display:flex;flex-direction:column;gap:3px;padding:15px 16px;text-align:left;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.qact b{font-size:14.5px;font-weight:700}
.qact span{font-size:12px;color:var(--muted)}
.qact .icn{margin-bottom:7px;color:var(--primary)}
.notice{display:flex;gap:10px;padding:13px 15px;border-radius:13px;font-size:12.5px;line-height:1.5;
  background:color-mix(in srgb,var(--star) 7%,var(--surface));border:1px dashed color-mix(in srgb,var(--star) 45%,var(--line));color:var(--muted)}
.notice .icn{flex:none;color:var(--star);margin-top:2px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:13px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}

.hero .btnrow{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.go.alt{background:rgba(255,255,255,.12);color:var(--primary-ink);border:1px solid rgba(255,255,255,.35)}
.go.alt:hover{filter:brightness(1.08)}
.setlabel{font-size:12px;font-weight:800;color:var(--muted);margin:12px 2px 7px}
.rlabel{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}

/* ---- exam ---- */
.xbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.xbar .prog{font-weight:800;font-size:14px}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:7px 12px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);margin-left:auto}
.timer.low{color:var(--wrong);border-color:color-mix(in srgb,var(--wrong) 45%,var(--line));background:var(--wrong-soft)}
.starr{margin-left:8px}
.starbtn{color:var(--line-d,#C9D4CE);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.starbtn.on{color:var(--star)}
.starbtn.on svg{fill:var(--star);stroke:var(--star)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qno{font-weight:800;font-size:13px;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:8px}
.qtype{font-size:11.5px;font-weight:700;color:var(--muted)}
.qtext{font-size:16.5px;font-weight:700;line-height:1.5;letter-spacing:-.01em;white-space:pre-wrap}
.tbox{margin:12px 0;padding:12px 14px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);
  font-size:13.5px;font-weight:500;color:var(--ink)}
.tbox div{padding:2px 0;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;padding:13px 15px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;line-height:1.45;transition:border-color .12s, background .12s}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;border:1.5px solid var(--line);color:var(--muted);margin-top:.5px}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .mark{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt.good{border-color:var(--primary);background:var(--primary-soft)}
.opt.good .mark{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt.bad{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.bad .mark{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt.lock{cursor:default}
.opt .tail{margin-left:auto;flex:none;display:grid;place-items:center;color:var(--primary)}
.opt.bad .tail{color:var(--wrong)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ox .opt{justify-content:center;font-size:19px;font-weight:800;padding:18px}
.expl{margin-top:14px;padding:14px 16px;border-radius:12px;border-left:4px solid var(--primary);
  background:var(--primary-soft);font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.expl b{color:var(--primary)}
.expl.none{border-left-color:var(--line);background:var(--surface2);color:var(--muted)}
.xnav{position:fixed;bottom:62px;left:0;right:0;z-index:25;padding:10px 14px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.xnav .in{max-width:760px;margin:0 auto;display:flex;gap:9px}
.xnav .btn{flex:1}
.xnav .btn.omr{flex:0 0 108px}

/* ---- OMR grid (signature) ---- */
.omrgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.omrgrid.g40{grid-template-columns:repeat(8,1fr)}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-size:12.5px;font-weight:700;
  border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.cell.filled{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 45%,var(--line));color:var(--primary)}
.cell.cur{outline:2.5px solid var(--primary);outline-offset:1.5px;color:var(--primary)}
.cell.ok{background:color-mix(in srgb,var(--primary) 88%,#000 0%);border-color:var(--primary);color:var(--primary-ink)}
.cell.no{background:var(--wrong);border-color:var(--wrong);color:#fff}
.cell.blank{background:repeating-linear-gradient(45deg,var(--wrong-soft),var(--wrong-soft) 4px,var(--surface) 4px,var(--surface) 8px);border-color:var(--wrong);color:var(--wrong)}
.cell.heat1{background:color-mix(in srgb,var(--wrong) 55%,var(--surface));border-color:transparent;color:#fff}
.cell.heat2{background:color-mix(in srgb,var(--star) 45%,var(--surface));border-color:transparent}
.cell.heat3{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.cell.heat4{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

/* ---- sheet / modal / toast ---- */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet.hidden,#modal.hidden,#toast.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,20,17,.45)}
.sheet-card{position:relative;width:100%;max-width:760px;max-height:78dvh;overflow:auto;background:var(--surface);
  border-radius:20px 20px 0 0;padding:18px 18px 26px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-grip{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px}
.modal-bg{position:absolute;inset:0;background:rgba(10,20,17,.45)}
.modal-card{position:relative;width:100%;max-width:430px;background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow);max-height:86dvh;overflow:auto}
.modal-card h3{font-size:16.5px;font-weight:800;margin-bottom:8px}
.modal-card p{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.modal-acts{display:flex;gap:9px;margin-top:16px}
.modal-acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}

/* ---- result ---- */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:24px 18px 18px}
.gauge{position:relative;width:170px;height:170px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .track{fill:none;stroke:var(--surface2);stroke-width:11}
.gauge .val{fill:none;stroke:var(--primary);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)}
.gauge.fail .val{stroke:var(--wrong)}
.gauge .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .mid b{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gauge .mid span{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.passline{margin-top:10px}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rsum .stat{text-align:center;padding:11px 6px}

/* ---- bank / list ---- */
.search{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:10px}
.search input{border:0;background:none;outline:none;flex:1;font-size:14px}
.search .icn{color:var(--muted)}
.qcard{margin-bottom:12px;overflow:hidden}
.qcard .pad{padding:16px}
.optrow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;font-size:13.5px;font-weight:600}
.optrow .mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;
  border:1.5px solid var(--line);color:var(--muted)}
.optrow.good{background:var(--primary-soft);color:var(--primary)}
.optrow.good .mark{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.qtools{display:flex;gap:6px;margin-left:auto}
.mini{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.mini:hover{color:var(--ink)}
.mini.on{color:var(--star)}
.mini.on svg{fill:var(--star);stroke:var(--star)}
.mini .icn{width:15.5px;height:15.5px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .icn{width:40px;height:40px;margin:0 auto 10px;opacity:.5}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
.empty p{font-size:13px}

/* ---- wrong / stats ---- */
.wrongrow{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:13px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:9px}
.wrongrow .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--wrong-soft);color:var(--wrong);
  display:grid;place-items:center;font-weight:800;font-size:13px}
.wrongrow .t{min-width:0;flex:1}
.wrongrow .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrongrow .t span{font-size:11.5px;color:var(--muted);font-weight:600}
.wrongrow .cnt{flex:none;font-size:11px;font-weight:800;color:var(--wrong);background:var(--wrong-soft);border-radius:999px;padding:3px 9px}
.wrongrow .cnt.hot{background:var(--star);color:#fff}
.trend{display:flex;align-items:flex-end;gap:7px;height:120px;padding:14px 16px 10px}
.trend .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.trend .bar i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--primary-soft);
  border:1px solid color-mix(in srgb,var(--primary) 30%,var(--line));transition:height .6s}
.trend .bar i.pri{background:var(--primary);border-color:var(--primary)}
.trend .bar span{font-size:9.5px;font-weight:700;color:var(--muted)}
.hist{padding:4px 0}
.hist .row{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13px}
.hist .row:last-child{border-bottom:0}
.hist .row b{font-weight:800}
.hist .row .sc{margin-left:auto;font-weight:800;font-size:15px}
.hist .row .sc.fail{color:var(--wrong)}
.hist .row .sc.pass{color:var(--primary)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:13.5px;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.anspick{display:flex;gap:7px;flex-wrap:wrap}
.anspick .chip{cursor:pointer}
@media (min-width:640px){
  .omrgrid.g40{grid-template-columns:repeat(10,1fr)}
  .qgrid{grid-template-columns:repeat(4,1fr)}
  .statrow{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="wrap">
  <header id="top">
    <div class="brand"><span class="logo">변</span><div><h1>변액보험 판매관리사</h1><p>실전모의고사 1~5회 · 200문항</p></div></div>
    <button class="iconbtn" id="darkBtn" data-act="dark" aria-label="다크 모드 전환"></button>
  </header>
  <main id="screen"></main>
  <nav id="tabbar"><div class="in">
    <button class="tab on" data-act="tab" data-tab="home"><span class="icn"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4.5l8 7V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></span>홈</button>

function startSession(ids,mode,instant,set){
  if(!ids.length){toast("풀 수 있는 문항이 없어요");return}
  X={mode,instant:!!instant,set:set||null,ids:ids.slice(),idx:0,ans:{},revealed:{},startAt:Date.now(),
     deadline:mode==="real"?Date.now()+60*60*1000:null,submitted:false,result:null};
  persistP();V.tab="exam";render();window.scrollTo(0,0)
}
function persistP(){S.progress=X&&!X.submitted?JSON.parse(JSON.stringify(X)):null;save()}
function curQ(){return QQ(X.ids[X.idx])}
function answer(v){
  const q=curQ();if(X.revealed[q.id])return;
  X.ans[q.id]=v;
  if(X.instant)X.revealed[q.id]=true;
  persistP();
  renderExamCard();
}
function move(d){const n=X.idx+d;if(n<0||n>=X.ids.length)return;X.idx=n;persistP();renderExamCard();window.scrollTo({top:0,behavior:"smooth"})}
function jump(i){X.idx=i;persistP();closeSheet();renderExamCard();window.scrollTo({top:0,behavior:"smooth"})}
function finishExam(){
  if(!X||X.submitted)return;
  const per=X.ids.map(id=>{const q=QQ(id),a=X.ans[id];return {id,ok:isCorrect(q,a),un:a===undefined}});
  const ok=per.filter(p=>p.ok).length;
  const score=Math.round(ok*2.5*10)/10;
  X.result={per,ok,score,unanswered:per.filter(p=>p.un).length};
  per.forEach(p=>{
    const st=S.stats[p.id]||{a:0,c:0};st.a++;if(p.ok)st.c++;S.stats[p.id]=st;
    if(p.ok){if(S.settings.autoRemove)delete S.wrong[p.id]}
    else{const w=S.wrong[p.id]||{c:0,t:0};w.c++;w.t=Date.now();S.wrong[p.id]=w}
  });
  S.history.unshift({d:Date.now(),mode:X.mode,set:X.set,score,ok,n:X.ids.length,dur:Date.now()-X.startAt});
  if(S.history.length>50)S.history.length=50;
  X.submitted=true;S.progress=null;save();
}

}

function omrGrid(ids,ansMap,cls,okMap,curIdx){
  return '<div class="omrgrid '+(cls||"")+'">'+ids.map((id,i)=>{
    let c="cell",a=ansMap?ansMap[id]:undefined;
    if(okMap){c+=okMap[id]===undefined?"":(okMap[id]?" ok":" no");if(okMap[id]===undefined&&a!==undefined)c+=" blank";if(okMap[id]===undefined&&a===undefined)c+=" blank"}
    else if(a!==undefined)c+=" filled";
    if(curIdx===i)c+=" cur";
    return '<button class="'+c+'" data-act="jump" data-i="'+i+'" title="'+qn(QQ(id))+'번">'+qn(QQ(id))+"</button>"
  }).join("")+"</div>"
}
function starBtnHTML(q,extra){

}
function reviewChip(q){return q.rv?'<span class="chip warn" title="이미지 판독 기반 문항입니다. 원본과 대조해 확인하고 연필 버튼으로 수정할 수 있어요.">'+ic("warn")+'판독 검토</span>':""}

function explHTML(q,ansIdx){
  const a=q.type==="ox"?q.answer:NUM[q.answer];
  return '<div class="expl'+(q.expl?"":" none")+'"><b>정답 '+a+'</b>'+(q.expl?" — "+esc(q.expl):"<br>등록된 해설이 없습니다.")+"</div>"
}
function qBody(q,ansIdx,showAns,optsHTML){
  let h="";
  if(q.tb)h+='<div class="tbox">'+q.tb.map(t=>"<div>"+esc(t)+"</div>").join("")+"</div>";
  h+=optsHTML;
  if(showAns)h+=explHTML(q,ansIdx);

}
function mcOptsHTML(q,sel,lock,ok){
  return '<div class="opts">'+q.opts.map((o,i)=>{
    let c="opt";let tail="";
    if(lock){
      if(i===q.answer){c+=" good";tail=ic("check")}
      else if(i===sel){c+=" bad";tail=ic("x")}
      c+=" lock"
    }else if(i===sel){c+=" sel"}
    return '<button class="'+c+'" data-act="ans" data-v="'+i+'"><span class="mark">'+NUM[i]+"</span><span>"+esc(o)+"</span>"+(tail?'<span class="tail">'+tail+"</span>":"")+"</button>"
  }).join("")+"</div>"
}
function oxOptsHTML(q,sel,lock){
  return '<div class="ox">'+OXK.map((k,i)=>{
    let c="opt";let tail="";
    if(lock){if(k===q.answer){c+=" good";tail=ic("check")}else if(k===sel){c+=" bad";tail=ic("x")}c+=" lock"}
    else if(k===sel){c+=" sel"}
    return '<button class="'+c+'" data-act="ans" data-v="'+k+'"><span>'+k+"</span>"+(tail?'<span class="tail">'+tail+"</span>":"")+"</button>"
  }).join("")+"</div>"
}

  '<div class="chip row">'+chip("all","전체 "+allQ().length)+chip("star","즐겨찾기 "+(S.bookmarks.length||""))+chip("wrong","오답 "+wrongCount())+chip("hot","자주 틀림")+chip("ox","O·X형")+"</div>"+
  '<p class="muted" style="font-size:12px;margin:10px 2px 0">전체 문항에 정답과 해설이 표시됩니다. 연필 버튼으로 문항을 수정할 수 있어요.</p><div style="height:10px"></div>';
  if(!list.length)h+='<div class="empty">'+ic("search")+"<b>해당 문항이 없어요</b><p>검색어나 필터를 바꿔보세요</p></div>";
  list.forEach(q=>h+=qCardFull(q));
  document.getElementById("screen").innerHTML=h;
  const inp=document.getElementById("bsearch");
  inp.addEventListener("input",()=>{UI.bs=inp.value.trim();const sc=window.scrollY;renderBank();const i2=document.getElementById("bsearch");i2.focus();i2.setSelectionRange(i2.value.length,i2.value.length);window.scrollTo(0,sc)});
}
function renderWrong(){
  const ids=Object.keys(S.wrong).map(Number).sort((a,b)=>S.wrong[b].c-S.wrong[a].c||S.wrong[b].t-S.wrong[a].t);
  const hot=ids.filter(id=>S.wrong[id].c>=2);
  let h='<div class="card pad" style="display:flex;align-items:center;gap:12px">'+
  '<div style="flex:1"><b style="font-size:15.5px">오답노트</b><p class="muted" style="font-size:12.5px;margin-top:2px">'+ids.length+'문항 저장 중'+(S.settings.autoRemove?" · 맞히면 자동 해제":"")+'</p></div>'+
  '<button class="btn sm" data-act="toggleAuto">'+(S.settings.autoRemove?"자동 해제 켜짐":"자동 해제 꺼짐")+'</button>'+
  '<button class="btn sm pri" data-act="retakeWrong" '+(ids.length?"":"disabled")+'>다시 풀기</button></div>';
  if(hot.length){
    h+='<div class="sec-title">자주 틀리는 문제 (2회 이상)</div>';
    hot.forEach(id=>{const q=QQ(id);h+='<div class="wrongrow"><span class="n">'+id+'</span><div class="t"><b>'+esc(q.q)+"</b><span>"+(q.type==="ox"?"O·X형":"객관식")+'</span></div><span class="cnt hot">'+S.wrong[id].c+'회</span>'+
    '<button class="mini'+(isStar(id)?" on":"")+'" data-act="star" data-id="'+id+'">'+ic("star")+'</button><button class="mini" data-act="delwrong" data-id="'+id+'">'+ic("trash")+"</button></div>"});
  }
  h+='<div class="sec-title">저장된 오답 ('+ids.length+')</div>';
  if(!ids.length)h+='<div class="empty">'+ic("check")+"<b>오답이 비어 있어요</b><p>시험·연습에서 틀린 문항이 자동으로 모입니다</p></div>";
  ids.forEach(id=>{const q=QQ(id);const w=S.wrong[id];
    h+='<div class="card qcard"><div class="pad"><div class="qhead"><span class="qno">'+qn(q)+'번</span><span class="qtype">'+(q.type==="ox"?"O·X형":"객관식")+' · 최근 '+fmtDate(w.t)+"</span>"+reviewChip(q)+
    '<span class="qtools"><span class="cnt'+(w.c>=2?" hot":"")+'" style="margin-right:2px">'+w.c+'회</span>'+starBtnHTML(q)+'<button class="mini" data-act="delwrong" data-id="'+id+'">'+ic("trash")+"</button></span></div>"+
    '<div class="qtext">'+esc(q.q)+"</div>"+(q.tb?'<div class="tbox">'+q.tb.map(t=>"<div>"+esc(t)+"</div>").join("")+"</div>":"")+
    '<div class="expl'+(q.expl?"":" none")+'"><b>정답 '+(q.type==="ox"?q.answer:NUM[q.answer])+"</b>"+(q.expl?" — "+esc(q.expl):"<br>등록된 해설이 없습니다.")+"</div></div></div>"
  });
  document.getElementById("screen").innerHTML=h;
}
function renderStats(){
  const hs=S.history;
  let h='<div class="sec-title">요약</div><div class="statrow">'+
  '<div class="stat"><b>'+hs.length+'</b><span>응시</span></div>'+
  '<div class="stat"><b>'+(hs.length?Math.round(hs.reduce((a,x)=>a+x.score,0)/hs.length*10)/10:"—")+'</b><span>평균 점수</span></div>'+
  '<div class="stat"><b>'+(hs.length?Math.max(...hs.map(x=>x.score)):"—")+'</b><span>최고</span></div>'+
  '<div class="stat"><b>'+wrongCount()+'</b><span>오답</span></div></div>';
  const last=hs.slice(0,10).reverse();
  if(last.length){h+='<div class="sec-title">점수 추이 (최근 '+last.length+'회)</div><div class="card trend">'+
    last.map((x,i)=>{const n=hs.length-last.length+i+1;const ht=Math.max(6,Math.round(x.score));return '<div class="bar"><i class="'+(x.score>=60?"pri":"")+'" style="height:'+ht+'%" title="'+x.score+'점"></i><span>'+n+"</span></div>"}).join("")+"</div>"}
  h+='<div class="sec-title">문항별 정답률</div><div class="card pad">'+
  '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">'+
  '<span class="cell heat1" style="width:26px;cursor:default">낮음</span><span class="cell heat3" style="width:26px;cursor:default">보통</span><span class="cell heat4" style="width:26px;cursor:default">높음</span></div>'+
  [1,2,3,4,5].map(stn=>'<div class="setlabel">제'+stn+'회</div><div class="omrgrid g40">'+ALL.filter(q=>q.s===stn).map(q=>{const st=S.stats[q.id];
    if(!st||!st.a)return '<span class="cell" style="cursor:default" title="'+qn(q)+'번: 기록 없음">'+qn(q)+"</span>";
    const r=st.c/st.a;const c=r<0.5?"heat1":r<0.8?"heat2":r<1?"heat3":"heat4";
    return '<span class="cell '+c+'" style="cursor:default" title="'+qn(q)+"번: "+st.c+"/"+st.a+" ("+Math.round(r*100)+'%)">'+qn(q)+"</span>"}).join("")+"</div>").join("")+"</div></div>";
  h+='<div class="sec-title">시험 이력</div><div class="card hist">';
  if(!hs.length)h+='<div class="empty">'+ic("chart")+"<b>기록이 아직 없어요</b><p>실전 모의고사를 응시하면 점수가 쌓입니다</p></div>";
  hs.forEach(x=>{h+='<div class="row"><span class="muted" style="font-size:12px;width:88px;flex:none">'+fmtDate(x.d)+'</span><span>'+(x.mode==="real"?(x.set?"제"+x.set+"회 실전":"실전"):"연습")+' · '+x.ok+"/"+x.n+' · '+fmtDur(x.dur)+'</span><span class="sc '+(x.score>=60?"pass":"fail")+'">'+x.score+"점</span></div>"});
  h+="</div>";
  h+='<div class="sec-title">데이터 관리</div><div class="card pad" style="display:flex;gap:9px;flex-wrap:wrap">'+
  '<button class="btn sm" data-act="export">'+ic("down")+'백업 내보내기</button>'+
  '<button class="btn sm" data-act="import">'+ic("up")+'백업 가져오기</button>'+
  '<button class="btn sm danger" data-act="resetall">'+ic("trash")+"전체 초기화</button>"+
  '<input type="file" id="impfile" accept=".json,application/json" style="display:none"></div>';
  document.getElementById("screen").innerHTML=h;
}
function render(){
  document.querySelectorAll("#tabbar .tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===V.tab));
  const scr=document.getElementById("screen");
  if(V.tab==="home")scr.innerHTML=renderHome();
  else if(V.tab==="exam")goExam();
  else if(V.tab==="bank")renderBank();
  else if(V.tab==="wrong")renderWrong();
  else if(V.tab==="stats")renderStats();
  document.querySelector('.tab[data-tab="wrong"] .dot').style.display=wrongCount()?"grid":"none";
  document.querySelector('.tab[data-tab="wrong"] .dot').textContent=wrongCount();
  updateDarkBtn();
}

/* ===== timer ===== */
let tInt=null;
function tickTimer(){
  if(tInt){clearInterval(tInt);tInt=null}
  if(!X||X.submitted||V.tab!=="exam")return;
  const upd=()=>{
    const el=document.getElementById("tval");if(!el)return;
    if(X.mode==="real"){
      const left=X.deadline-Date.now();
      if(left<=0){finishExam();render();return}
      const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
      el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
      document.getElementById("xtimer").classList.toggle("low",left<5*60000)
    }else{
      const el2=Math.floor((Date.now()-X.startAt)/1000);
      el.textContent=String(Math.floor(el2/60)).padStart(2,"0")+":"+String(el2%60).padStart(2,"0")
    }
  };
  upd();tInt=setInterval(upd,1000);
}
setInterval(()=>{if(V.tab==="exam"&&X&&!X.submitted)tickTimer()},2000);

/* ===== sheet / modal / toast ===== */
function openSheet(){
  const done=X.ids.filter(id=>X.ans[id]!==undefined).length;
  document.getElementById("sheet").innerHTML='<div class="sheet-bg" data-act="sheet-close"></div>'+
  '<div class="sheet-card"><div class="sheet-grip"></div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
  '<b>답안지 · '+done+" / "+X.ids.length+' 응답</b><button class="btn sm" data-act="sheet-close">'+ic("x")+"닫기</button></div>"+
  omrGrid(X.ids,X.ans,"g40",null,X.idx)+
  '<button class="btn pri wide" style="margin-top:16px" data-act="submit">제출하고 채점하기</button></div>';
  document.getElementById("sheet").classList.remove("hidden")
}
function closeSheet(){document.getElementById("sheet").classList.add("hidden")}
function openModal(html){document.getElementById("modalCard").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
let toastT=null;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("hidden"),1800)}

/* ===== edit ===== */
function openEdit(id){
  const q=QQ(id);
  const opts=(q.opts||["","","",""]).map((o,i)=>'<div class="field"><label>'+(q.type==="mc"?NUM[i]+" 보기":"")+"</label>"+(q.type==="mc"?'<input type="text" id="eo'+i+'" value="'+esc(o)+'">':"")+"</div>").join("");
  const ansPick=q.type==="ox"
    ?'<div class="anspick"><button class="chip'+(q.answer==="O"?" on":"")+'" data-act="pickans" data-v="O">O (맞음)</button><button class="chip'+(q.answer==="X"?" on":"")+'" data-act="pickans" data-v="X">X (틀림)</button></div>'
    :'<div class="anspick">'+NUM.map((n,i)=>'<button class="chip'+(q.answer===i?" on":"")+'" data-act="pickans" data-v="'+i+'">'+n+"</button>").join("")+"</div>";
  window._edit={id,ans:q.answer};
  openModal('<h3>'+qn(QQ(id))+'번 문항 수정</h3><p>이미지 판독 오류를 직접 고칠 수 있어요. 수정은 이 브라우저에 저장됩니다.</p>'+
  '<div class="field"><label>문제</label><textarea id="eq" rows="4">'+esc(q.q)+"</textarea></div>"+
  (q.type==="mc"?opts:"")+
  '<div class="field"><label>정답</label>'+ansPick+"</div>"+
  '<div class="field"><label>해설</label><textarea id="ee" rows="3">'+esc(q.expl||"")+"</textarea></div>"+
  '<div class="modal-acts"><button class="btn" data-act="modal-close">취소</button><button class="btn pri" data-act="edit-save">저장</button></div>')
}

/* ===== actions ===== */
function pool(range){
  if(range==="s1")return ALL.filter(q=>q.s===1).map(q=>q.id);
  if(range==="s2")return ALL.filter(q=>q.s===2).map(q=>q.id);
  if(range==="s1a")return ALL.filter(q=>q.s===1&&q.id<=20).map(q=>q.id);
  if(range==="s1b")return ALL.filter(q=>q.s===1&&q.id>20).map(q=>q.id);
  if(range==="s2a")return ALL.filter(q=>q.s===2&&q.n<=20).map(q=>q.id);
  if(range==="s2b")return ALL.filter(q=>q.s===2&&q.n>20).map(q=>q.id);
  if(range==="s3")return ALL.filter(q=>q.s===3).map(q=>q.id);
  if(range==="s3a")return ALL.filter(q=>q.s===3&&q.n<=20).map(q=>q.id);
  if(range==="s3b")return ALL.filter(q=>q.s===3&&q.n>20).map(q=>q.id);
  if(range==="s4")return ALL.filter(q=>q.s===4).map(q=>q.id);
  if(range==="s4a")return ALL.filter(q=>q.s===4&&q.n<=20).map(q=>q.id);
  if(range==="s4b")return ALL.filter(q=>q.s===4&&q.n>20).map(q=>q.id);
  if(range==="s5")return ALL.filter(q=>q.s===5).map(q=>q.id);
  if(range==="s5a")return ALL.filter(q=>q.s===5&&q.n<=20).map(q=>q.id);
  if(range==="s5b")return ALL.filter(q=>q.s===5&&q.n>20).map(q=>q.id);
  if(range==="star")return S.bookmarks.slice();
  if(range==="wrong")return Object.keys(S.wrong).map(Number);
  return ALL.map(q=>q.id)
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,id=el.dataset.id?+el.dataset.id:null;
  switch(act){
    case"tab":V.tab=el.dataset.tab;if(V.tab==="exam"&&X&&!X.submitted){render()}else if(V.tab==="exam"){X=null}render();window.scrollTo(0,0);break;
    case"gotoExam":V.tab="exam";render();window.scrollTo(0,0);break;
    case"dark":S.settings.dark=!S.settings.dark;document.documentElement.dataset.theme=S.settings.dark?"dark":"";save();updateDarkBtn();break;
    case"startReal":{const st=+(el.dataset.set||1);startSession(ALL.filter(q=>q.s===st).map(q=>q.id),"real",false,st);break}
    case"startPractice":{
      let ids=pool(UI.setup.range).sort((a,b)=>a-b);
      if(UI.setup.random)ids=ids.slice().sort(()=>Math.random()-.5);
      const c=UI.setup.count;if(c!=="all")ids=ids.slice(0,+c);
      startSession(ids,"practice",UI.setup.instant);break}
    case"random10":startSession(ALL.map(q=>q.id).sort(()=>Math.random()-.5).slice(0,10),"practice",true);break;
    case"retakeWrong":{const ids=Object.keys(S.wrong).map(Number);if(!ids.length){toast("저장된 오답이 없어요");break}startSession(ids.sort((a,b)=>a-b),"practice",false);break}
    case"retakeStar":{const ids=S.bookmarks.slice();if(!ids.length){toast("즐겨찾기가 비어 있어요");break}startSession(ids.sort((a,b)=>a-b),"practice",true);break}
    case"resume":X=S.progress;S.progress=null;V.tab="exam";save();render();window.scrollTo(0,0);break;
    case"quit":openModal('<h3>시험을 종료할까요?</h3><p>지금까지의 응답은 저장되고 언제든 이어서 풀 수 있어요.</p><div class="modal-acts"><button class="btn" data-act="modal-close">계속 풀기</button><button class="btn pri" data-act="quit-save">저장하고 나가기</button></div>');break;
    case"quit-save":closeModal();persistP();X=null;V.tab="home";render();break;
    case"ans":answer(el.dataset.v==="O"||el.dataset.v==="X"?el.dataset.v:+el.dataset.v);break;
    case"prev":move(-1);break;
    case"next":if(X.idx===X.ids.length-1)submitFlow();else move(1);break;
    case"jump":jump(+el.dataset.i);break;
    case"sheet":openSheet();break;
    case"sheet-close":closeSheet();break;
    case"submit":submitFlow();break;
    case"do-submit":doSubmit();break;
    case"star":toggleStar(id);if(V.tab==="exam"&&!X.submitted){const sb=document.querySelector('#xcard .starbtn');if(sb&&curQ().id===id)sb.classList.toggle("on",isStar(id));if(X.revealed[curQ().id])renderExamCard()}else render();break;
    case"go-home":X=null;V.tab="home";render();break;
    case"bfilter":UI.bf=el.dataset.v;renderBank();break;
    case"toggleAuto":S.settings.autoRemove=!S.settings.autoRemove;save();renderWrong();break;
    case"delwrong":delete S.wrong[id];save();renderWrong();toast(id+"번을 오답노트에서 삭제했어요");break;
    case"edit":openEdit(id);break;
    case"pickans":window._edit.ans=el.dataset.v==="O"||el.dataset.v==="X"?el.dataset.v:+el.dataset.v;el.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");break;
    case"edit-save":{
      const ed={q:document.getElementById("eq").value.trim(),expl:document.getElementById("ee").value.trim(),answer:window._edit.ans};
      const q=QQ(ed.id||window._edit.id);
      if(q.type==="mc"){ed.opts=[0,1,2,3].map(i=>document.getElementById("eo"+i)?document.getElementById("eo"+i).value.trim():q.opts[i])}
      S.edits[window._edit.id]=ed;save();closeModal();render();toast(qn(QQ(window._edit.id))+"번 문항을 수정했어요");break}
    case"export":{
      const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="변액보험모의고사_학습기록.json";a.click();toast("백업 파일을 내보냈어요");break}
    case"import":document.getElementById("impfile").click();break;
    case"resetall":openModal('<h3>전체 초기화</h3><p>응시 기록·오답노트·즐겨찾기·문항 수정이 모두 삭제됩니다. 되돌릴 수 없어요.</p><div class="modal-acts"><button class="btn" data-act="modal-close">취소</button><button class="btn danger" data-act="reset-go">삭제하기</button></div>');break;
    case"reset-go":localStorage.removeItem(KEY);location.reload();break;
    case"modal-close":closeModal();break;
    case"setup":{const g=el.dataset.g;let v=el.dataset.v;if(v==="true")v=true;else if(v==="false")v=false;UI.setup[g]=v;goExam();break}
  }
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("change",e=>{
  if(e.target.id==="impfile"&&e.target.files[0]){
    const f=new FileReader();
    f.onload=()=>{try{const d=JSON.parse(f.result);if(!d||typeof d!=="object")throw 0;S=Object.assign(CLONE(DEF),d);save();render();toast("백업을 불러왔어요")}catch(err){toast("올바른 백업 파일이 아니에요")}};
    f.readAsText(e.target.files[0])
  }
});
document.addEventListener("keydown",e=>{
  if(V.tab!=="exam"||!X||X.submitted)return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowLeft")move(-1);
  else if(e.key==="ArrowRight"){if(X.idx===X.ids.length-1)submitFlow();else move(1)}
  else if(/^[1-4]$/.test(e.key)&&curQ().type==="mc"&&!X.revealed[curQ().id])answer(+e.key-1);
  else if((e.key==="o"||e.key==="O")&&curQ().type==="ox")answer("O");
  else if((e.key==="x"||e.key==="X")&&curQ().type==="ox")answer("X");
  else if(e.key==="f"||e.key==="F")toggleStar(curQ().id);
});
function updateDarkBtn(){document.getElementById("darkBtn").innerHTML=ic(S.settings.dark?"sun":"moon")}
(function(){const h=(location.hash||"").replace("#","");if(["home","exam","bank","wrong","stats"].includes(h))V.tab=h})();render();
</script>
